# Applies the display settings of wely-realm that the login theme depends on.
#
# The realm export in wely-identity is only imported by the local overlay: dev's realm already
# exists, and Keycloak skips an existing realm on import. So a change to the export never
# reaches dev on its own. This hook carries the settings the login screen needs:
#   - displayName / displayNameHtml: the brand panel of the calendar-app login theme;
#   - French as the only locale. Internationalisation stays ENABLED on purpose: with it off,
#     Keycloak ignores the default locale and renders the whole screen in English;
#   - login events (LOGIN, LOGIN_ERROR, REGISTER, REGISTER_ERROR, LOGOUT), to see whether
#     visitors actually try the demo account: Realm settings -> Events in the admin console.
#     They record the client's IP address, hence the 30-day expiration (2592000 s). The
#     event listeners are not set here, so the default jboss-logging one stays.
#
#   - editUsernameAllowed, and realm-management's manage-users role for the wely-users service
#     account: editing a profile renames the Keycloak user through the Admin API. add-roles is
#     idempotent, so it runs at every sync like the rest.
#
#   - the wely-users-registration step, which creates the wely-users user during registration
#     (wely-identity, BusinessUserRegistration). Keycloak refuses executions on its built-in
#     "registration" flow, so the hook copies it to "wely registration", adds the step to the
#     copy's form with an explicit priority, so it runs after the step that creates the Keycloak
#     user (a new execution lands first, and updating one resets its priority unless given),
#     and makes the copy the realm's registration flow. Each part is done once and
#     left alone; the step is retried while the Keycloak pod that has the provider starts.
#
#   - wely://oauth-callback among wely-client's redirect URIs, for wely-ios's sign-up and sign-in
#     pages: appended once, the live URIs are kept.
#
#   - auth_time in wely-client's access tokens, which DELETE /user-service/profile requires: only
#     checked, last, so a failure never skips the steps above.
#
# realm-settings.json DUPLICATES those keys from wely-identity/wely-realm.json and must follow
# them. kcadm merges it into the live realm, so every other setting is left alone.
#
# PostSync with BeforeHookCreation: the Job is recreated at every sync instead of patched. A
# Job's template is immutable, and the image tag below changes with each Keycloak deploy — a
# plain Job would fail the sync on the next tag bump. Running at every sync also puts the
# settings back if someone changes them in the console.
apiVersion: batch/v1
kind: Job
metadata:
  name: wely-realm-settings
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: wely-realm-settings
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: settings
          configMap:
            name: wely-realm-settings
      containers:
        - name: kcadm
          # Same image as the Keycloak deployment: kustomize's images transformer gives it the
          # deployed tag, so kcadm always matches the server and the Pi already has the image.
          image: ghcr.io/welylabs/wely-keycloak:latest
          command:
            - sh
            - -c
            - |
              set -e
              K=/opt/keycloak/bin/kcadm.sh
              C=/tmp/kcadm.config
              # Keycloak may still be starting when the sync ends: retry the login for 5 min.
              for i in $(seq 1 30); do
                $K config credentials --config $C --server http://dev-wely-auth-service:8080 \
                  --realm master --user "$KC_ADMIN_USER" --password "$KC_ADMIN_PASSWORD" && break
                sleep 10
              done
              $K update realms/wely-realm --config $C -f /settings/realm-settings.json
              $K get realms/wely-realm --config $C --fields displayName,supportedLocales,defaultLocale,editUsernameAllowed
              $K add-roles -r wely-realm --config $C --uusername service-account-wely-users-api-client \
                --cclientid realm-management --rolename manage-users
              $K get-roles -r wely-realm --config $C --uusername service-account-wely-users-api-client \
                --cclientid realm-management --effective | grep -q '"manage-users"' \
                || { echo "manage-users is missing on the wely-users service account"; exit 1; }

              FLOW="wely registration"
              F="authentication/flows/wely%20registration%20registration%20form/executions"
              $K get authentication/flows -r wely-realm --config $C --fields alias --format csv --noquotes \
                | grep -qx "$FLOW" \
                || $K create authentication/flows/registration/copy -r wely-realm --config $C -s "newName=$FLOW"
              step() { $K get $F -r wely-realm --config $C --fields id,providerId --format csv --noquotes \
                         | grep ',wely-users-registration$' | cut -d, -f1; }
              for i in $(seq 1 30); do
                [ -n "$(step)" ] && break
                $K create $F/execution -r wely-realm --config $C -s provider=wely-users-registration && break
                sleep 10
              done
              [ -n "$(step)" ] || { echo "wely-users-registration could not be added"; exit 1; }
              # An execution update always sets the priority too (0 when omitted), and the copied
              # steps share low priorities: an explicit, much higher one keeps this step last,
              # after the step that creates the Keycloak user.
              $K update $F -r wely-realm --config $C \
                -b "{\"id\":\"$(step)\",\"requirement\":\"REQUIRED\",\"priority\":1000}"
              last() { $K get $F -r wely-realm --config $C --fields providerId --format csv --noquotes | tail -1; }
              [ "$(last)" = "wely-users-registration" ] || { echo "wely-users-registration is not last"; exit 1; }
              $K update realms/wely-realm --config $C -s "registrationFlow=$FLOW"
              $K get realms/wely-realm --config $C --fields registrationFlow
              $K get $F -r wely-realm --config $C --fields displayName,providerId,requirement

              CID=$($K get clients -r wely-realm --config $C -q clientId=wely-client --fields id --format csv --noquotes)
              IOS_REDIRECT="wely://oauth-callback"
              URIS=$($K get clients/$CID -r wely-realm --config $C --fields redirectUris | tr -d '\n ' \
                | sed 's/.*\[\(.*\)\].*/\1/')
              echo "$URIS" | grep -qF "\"$IOS_REDIRECT\"" \
                || $K update clients/$CID -r wely-realm --config $C -s "redirectUris=[${URIS:+$URIS,}\"$IOS_REDIRECT\"]"
              $K get clients/$CID -r wely-realm --config $C --fields redirectUris

              # auth_time comes from the AUTH_TIME note mapper of the 'basic' scope, a default scope
              # of wely-client, and lightweight access tokens would drop it.
              SID=$($K get client-scopes -r wely-realm --config $C --fields id,name --format csv --noquotes \
                | grep ',basic$' | cut -d, -f1)
              auth_time() {
                $K get clients/$CID -r wely-realm --config $C --fields 'attributes(*)' \
                  | grep -q '"client.use.lightweight.access.token.enabled" *: *"true"' && return 1
                $K get clients/$CID/default-client-scopes -r wely-realm --config $C --fields name --format csv \
                  --noquotes | grep -qx basic || return 1
                for M in $($K get client-scopes/$SID/protocol-mappers/models -r wely-realm --config $C \
                             --fields id,protocolMapper --format csv --noquotes \
                             | grep ',oidc-usersessionmodel-note-mapper$' | cut -d, -f1); do
                  J=$($K get client-scopes/$SID/protocol-mappers/models/$M -r wely-realm --config $C)
                  echo "$J" | grep -q '"user.session.note" *: *"AUTH_TIME"' \
                    && echo "$J" | grep -q '"access.token.claim" *: *"true"' \
                    && echo "$J" | grep -q '"claim.name" *: *"auth_time"' && return 0
                done
                return 1
              }
              auth_time || { echo "wely-client access tokens lack auth_time: DELETE /profile would always answer USR-BUS-010"; exit 1; }
              echo "wely-client access tokens carry auth_time"
          env:
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: dev-wely-secrets-dev, key: kc-admin-username }
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: dev-wely-secrets-dev, key: kc-admin-password }
          volumeMounts: [{ name: settings, mountPath: /settings }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
