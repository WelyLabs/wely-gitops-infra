# One pod of each doubled service always stays up while a node is drained (see the replicas patch in
# kustomization.yaml): a drain evicts the other one only once a replacement is ready elsewhere.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared
---
