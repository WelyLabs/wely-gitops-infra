# Puts the public demo account back in its initial state every night.
#
# Its credentials are published, so anyone can add events, send friend requests or chat from
# it. Each script removes what the demo users organised, joined or wrote — including what a
# visitor did towards real users — and inserts the dataset again. Real users' own data is not
# touched.
#
# The demo Keycloak user is not reset: it has no role on the account console, so a visitor
# can change neither its password nor its username.
#
# The Secret is named in full: it comes from a SealedSecret, which kustomize does not know
# is a Secret, so namePrefix does not rewrite references to it.
#
# The three steps run in order (init containers), each with the image of the database it
# talks to, so the client always matches the server and the Pi already has the image.
# Run it by hand with:
#   kubectl create job -n wely-dev --from=cronjob/dev-wely-demo-reset demo-reset-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wely-demo-reset
spec:
  schedule: "0 4 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: wely-demo-reset
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: scripts
              configMap:
                name: wely-demo-seed
            # The demo conversations' ids, listed before seed-mongo.js deletes them, for the photo purge.
            - name: work
              emptyDir: {}
          initContainers:
            - name: users
              image: postgres:17
              # Each step retries its first connection: a freshly created Job pod may send it
              # before kube-router has programmed this pod into the NetworkPolicy ingress sets,
              # which it then rejects (connection refused). The seed scripts are idempotent, so
              # replaying the whole command is safe; psql/cypher/mongosh exit non-zero on a
              # refused connection, which is exactly what we retry.
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 20); do
                    psql --host=dev-wely-postgres-users-service --dbname=users \
                         --set=demo_keycloak_id="$DEMO_KEYCLOAK_ID" --file=/scripts/seed-users.sql && exit 0
                    echo "users seed attempt $i failed, retrying in 5s"; sleep 5
                  done
                  echo "users seed failed after retries"; exit 1
              env:
                # Id of the Keycloak user "camille" (login: demo@welylabs.app) in wely-realm.
                - name: DEMO_KEYCLOAK_ID
                  value: be30df9c-665b-4f3f-91fc-d00b0a1cf47a
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: dev-wely-secrets-dev, key: users-db-username }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: dev-wely-secrets-dev, key: users-db-password }
              volumeMounts: [{ name: scripts, mountPath: /scripts }]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
            - name: social
              image: neo4j:5
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 20); do
                    cypher-shell -a bolt://dev-wely-neo4j-service:7687 -u "$NEO4J_USERNAME" -p "$NEO4J_PASSWORD" -f /scripts/seed-social.cypher && exit 0
                    echo "social seed attempt $i failed, retrying in 5s"; sleep 5
                  done
                  echo "social seed failed after retries"; exit 1
              env:
                - name: NEO4J_USERNAME
                  valueFrom:
                    secretKeyRef: { name: dev-wely-secrets-dev, key: neo4j-username }
                - name: NEO4J_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: dev-wely-secrets-dev, key: neo4j-password }
              volumeMounts: [{ name: scripts, mountPath: /scripts }]
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 384Mi }
            # The conversations a demo account takes part in, and the events it organizes, before the
            # cleanup below loses them: photos, covers and receipts go with the demo, like the rest.
            - name: chat-photos
              image: mongo:6.0
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 20); do
                    mongosh --quiet "mongodb://dev-wely-mongodb-service:27017/?authSource=admin" \
                      -u "$MONGO_USERNAME" -p "$MONGO_PASSWORD" \
                      --eval 'db.getSiblingDB("chat_db").conversations.find({ participantIds: { $in: process.env.DEMO_USER_IDS.trim().split(/\s+/) } }, { _id: 1 }).forEach(c => print(c._id.toString()))' \
                      > /work/conversations && echo "$(wc -l < /work/conversations) demo conversations" \
                    && mongosh --quiet "mongodb://dev-wely-mongodb-service:27017/?authSource=admin" \
                      -u "$MONGO_USERNAME" -p "$MONGO_PASSWORD" \
                      --eval 'db.getSiblingDB("events_db").events.find({ organizerId: { $in: process.env.DEMO_USER_IDS.trim().split(/\s+/) } }, { _id: 1 }).forEach(e => print(e._id.toString()))' \
                      > /work/events && echo "$(wc -l < /work/events) demo events" \
                    && exit 0
                    echo "chat-photos listing attempt $i failed, retrying in 5s"; sleep 5
                  done
                  echo "chat-photos listing failed after retries"; exit 1
              env:
                - name: DEMO_USER_IDS
                  value: >-
                    89a380b8-f66a-44d0-b9d9-616241080430 a0cac685-c593-415d-bd73-6530e25a1f53
                    9de75282-095c-41a9-ab17-2d58b02445da 50c7b996-ebf8-40e1-a0a5-5dc634f9b793
                    0fa728fe-fd0e-4997-b226-fd049c6b0659 15d05360-522a-4ff1-93a9-07d63346e4c1
                    4d6501b7-caed-4a98-b960-199db1bd4106 66e332e6-8d98-49c6-ac22-27095c35cf9d
                    f4be7974-0ed3-457e-80d3-8aa08e0c5197 cdc6f71d-065c-4af5-9775-692411fc9504
                - name: MONGO_USERNAME
                  valueFrom:
                    secretKeyRef: { name: dev-wely-secrets-dev, key: mongo-root-username }
                - name: MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: dev-wely-secrets-dev, key: mongo-root-password }
              volumeMounts: [{ name: work, mountPath: /work }]
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
            # Pictures a visitor uploaded on a demo account: removed, so the next visitor sees the
            # seeded avatars, which seed-users.sql has just put back; and the photos sent in the
            # demo conversations. rclone, with the wely-demo-reset Garage key; purge succeeds when
            # there is nothing to remove.
            - name: avatars
              image: rclone/rclone:1.75.2
              command:
                - sh
                - -c
                - |
                  run() {
                    set -e
                    R=":s3,provider=Other,endpoint=http://dev-wely-garage-service:3900,region=garage,force_path_style=true,access_key_id=$ACCESS_KEY,secret_access_key=$SECRET_KEY:wely-avatars/avatars"
                    for id in $DEMO_USER_IDS; do rclone purge "$R/$id"; done
                    C=":s3,provider=Other,endpoint=http://dev-wely-garage-service:3900,region=garage,force_path_style=true,access_key_id=$ACCESS_KEY,secret_access_key=$SECRET_KEY:wely-chat-media/chat"
                    while read -r conversation; do rclone purge "$C/$conversation"; done < /work/conversations
                    E=":s3,provider=Other,endpoint=http://dev-wely-garage-service:3900,region=garage,force_path_style=true,access_key_id=$ACCESS_KEY,secret_access_key=$SECRET_KEY:wely-event-media/events"
                    while read -r event; do rclone purge "$E/$event"; done < /work/events
                    echo "demo pictures, photos, covers and receipts removed"
                  }
                  for i in $(seq 1 20); do
                    run && exit 0
                    echo "avatars purge attempt $i failed, retrying in 5s"; sleep 5
                  done
                  echo "avatars purge failed after retries"; exit 1
              env:
                # The demo users' ids, as in seed-mongo.js.
                - name: DEMO_USER_IDS
                  value: >-
                    89a380b8-f66a-44d0-b9d9-616241080430 a0cac685-c593-415d-bd73-6530e25a1f53
                    9de75282-095c-41a9-ab17-2d58b02445da 50c7b996-ebf8-40e1-a0a5-5dc634f9b793
                    0fa728fe-fd0e-4997-b226-fd049c6b0659 15d05360-522a-4ff1-93a9-07d63346e4c1
                    4d6501b7-caed-4a98-b960-199db1bd4106 66e332e6-8d98-49c6-ac22-27095c35cf9d
                    f4be7974-0ed3-457e-80d3-8aa08e0c5197 cdc6f71d-065c-4af5-9775-692411fc9504
                - name: ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: dev-wely-garage, key: garage-reset-access-key }
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef: { name: dev-wely-garage, key: garage-reset-secret-key }
              volumeMounts: [{ name: work, mountPath: /work }]
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { memory: 128Mi }
          containers:
            - name: events-and-chat
              image: mongo:6.0
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 20); do
                    mongosh --quiet "mongodb://dev-wely-mongodb-service:27017/?authSource=admin" -u "$MONGO_USERNAME" -p "$MONGO_PASSWORD" --file /scripts/seed-mongo.js && exit 0
                    echo "events/chat seed attempt $i failed, retrying in 5s"; sleep 5
                  done
                  echo "events/chat seed failed after retries"; exit 1
              env:
                - name: MONGO_USERNAME
                  valueFrom:
                    secretKeyRef: { name: dev-wely-secrets-dev, key: mongo-root-username }
                - name: MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: dev-wely-secrets-dev, key: mongo-root-password }
              volumeMounts: [{ name: scripts, mountPath: /scripts }]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
