apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- namespace.yaml
- wely-sealed-secrets-dev.yaml

namespace: wely-dev

namePrefix: dev-

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: "http://dev-wely-gateway-service.wely-dev.svc.cluster.local:8081"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: KEYCLOAK_URL
        value: "https://dev-auth.welylabs.app"
  target:
    kind: Deployment
    name: wely-web
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "https://dev-auth.welylabs.app/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "http://dev-wely-users-service:8082"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "http://dev-wely-social-service:8083"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "http://dev-wely-chat-service:8084"
    - op: replace
      path: /spec/template/spec/containers/0/env/6/value
      value: "ws://dev-wely-chat-service:8084"
    - op: replace
      path: /spec/template/spec/containers/0/env/7/value
      value: "http://dev-wely-events-service:8086"
    - op: replace
      path: /spec/template/spec/containers/0/env/9/value
      value: "https://dev-web.welylabs.app"
  target:
    kind: Deployment
    name: wely-gateway
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "r2dbc:postgresql://dev-wely-postgres-users-service:5432/users"
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "https://dev-auth.welylabs.app/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/token"
    - op: replace
      path: /spec/template/spec/containers/0/env/6/value
      value: "http://dev-wely-auth-service:8080"
    - op: replace
      path: /spec/template/spec/containers/0/env/9/value
      value: "dev-wely-kafka-service:9092"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
        value: "PLAINTEXT"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_CLOUD_STREAM_KAFKA_BINDER_CONFIGURATION_SECURITY_PROTOCOL
        value: "PLAINTEXT"
  target:
    kind: Deployment
    name: wely-users
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "neo4j://dev-wely-neo4j-service:7687"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "dev-wely-kafka-service:9092"
    - op: replace
      path: /spec/template/spec/containers/0/env/7/value
      value: "https://dev-auth.welylabs.app/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/8/value
      value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
        value: "PLAINTEXT"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_CLOUD_STREAM_KAFKA_BINDER_CONFIGURATION_SECURITY_PROTOCOL
        value: "PLAINTEXT"
  target:
    kind: Deployment
    name: wely-social
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@dev-wely-mongodb-service:27017/chat_db?authSource=admin"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "https://dev-auth.welylabs.app/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
  target:
    kind: Deployment
    name: wely-chat
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@dev-wely-mongodb-service:27017/events_db?authSource=admin"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "https://dev-auth.welylabs.app/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
  target:
    kind: Deployment
    name: wely-events
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "https://dev-auth.welylabs.app"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "true"
    - op: replace
      path: /spec/template/spec/containers/0/env/7/value
      value: "jdbc:postgresql://dev-wely-postgres-auth-service:5432/keycloak"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: USERS_API_URL
        value: "http://dev-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-auth
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "PLAINTEXT://dev-wely-kafka-service:9092"
  target:
    kind: Deployment
    name: wely-kafka
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: "dev-wely-kafka-service:9092"
  target:
    kind: Deployment
    name: wely-kafka-ui

images:
- name: ghcr.io/welylabs/wely-chat
  newName: ghcr.io/welylabs/wely-chat
  newTag: sha-2b4e5a795aac8989873abfbe32ca7950b1515b94
- name: ghcr.io/welylabs/wely-events
  newName: ghcr.io/welylabs/wely-events
  newTag: sha-16bc7fea8a482a70a37d28f512423b49841cb996
- name: ghcr.io/welylabs/wely-gateway
  newName: ghcr.io/welylabs/wely-gateway
  newTag: sha-fc5c0bfb94ddb91cef5c42deac5dd6f40c31ca08
- name: ghcr.io/welylabs/wely-keycloak
  newName: ghcr.io/welylabs/wely-keycloak
  newTag: sha-d4012dbe83c842bf7dceb20199f54b70ab64b593
- name: ghcr.io/welylabs/wely-social
  newName: ghcr.io/welylabs/wely-social
  newTag: sha-2188c38eb96f245a6b02050c49e10874eb67ba09
- name: ghcr.io/welylabs/wely-users
  newName: ghcr.io/welylabs/wely-users
