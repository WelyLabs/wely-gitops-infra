apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- namespace.yaml
- wely-sealed-secrets-dev.yaml
- demo/demo-reset.yaml
- realm/realm-settings-job.yaml

# Dataset of the public demo account, replayed nightly by demo/demo-reset.yaml.
# Display settings of wely-realm, applied by realm/realm-settings-job.yaml after each sync.
configMapGenerator:
- files:
  - demo/seed-users.sql
  - demo/seed-social.cypher
  - demo/seed-mongo.js
  name: wely-demo-seed
- files:
  - realm/realm-settings.json
  name: wely-realm-settings

namespace: wely-dev

namePrefix: dev-

# Keyed by environment-variable name rather than by index, like the wely-chat patch below
# and unlike the rest of this file. The gateway's env list grew when Redis was added, and an
# index patch says nothing about which variable it means — it silently rewrites whatever
# happens to sit at that position.
            # namePrefix renames the Service but not a value that merely spells its name, so
            # the prefix has to be written out here or the gateway looks up a host that does
            # not exist.
