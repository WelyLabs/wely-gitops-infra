- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-media
    spec:
      template:
        spec:
          containers:
          - name: media
            env:
            # Pictures are on Cloudflare R2 since 2026-11-15, buckets wely-dev-*, token wely-dev-media sealed in
            # wely-sealed-cloud-dev.yaml. Writes and signed reads both name R2's S3 endpoint: the browser
            # fetches a picture from R2 with the signed URL, wely-media never carries the bytes.
            - name: MEDIA_INTERNAL_ENDPOINT
              value: "https://8ff69e80b72df2e5541b83562ac4189e.r2.cloudflarestorage.com"
            - name: MEDIA_PUBLIC_ENDPOINT
              value: "https://8ff69e80b72df2e5541b83562ac4189e.r2.cloudflarestorage.com"
            - name: MEDIA_REGION
              value: "auto"
            - name: AVATARS_BUCKET
              value: "wely-dev-avatars"
            - name: CHAT_BUCKET
              value: "wely-dev-chat-media"
            - name: EVENTS_BUCKET
              value: "wely-dev-event-media"
            - name: COMMUNITIES_BUCKET
              value: "wely-dev-community-media"
            - name: MEDIA_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: media-access-key, optional: false }
            - name: MEDIA_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: media-secret-key, optional: false }
  target:
