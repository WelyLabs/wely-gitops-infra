apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- namespace.yaml
- wely-sealed-secrets-dev.yaml
# Garage's RPC secret, admin token and keys, sealed apart from the shared secret (see
# base/wely-secrets.example.yaml, second document).
- wely-sealed-garage-dev.yaml
# Cloudflare Realtime keys for calls (SFU and TURN), read by wely-chat only.
- wely-sealed-calls-dev.yaml
# VAPID keys of wely-notifications (Web Push).
- wely-sealed-notifications-dev.yaml
- demo/demo-reset.yaml
- realm/realm-settings-job.yaml

# Dataset of the public demo account, replayed nightly by demo/demo-reset.yaml.
# Display settings of wely-realm, applied by realm/realm-settings-job.yaml after each sync.
configMapGenerator:
- files:
  - demo/seed-users.sql
  - demo/seed-social.cypher
  - demo/seed-mongo.js
  name: wely-demo-seed
- files:
  - realm/realm-settings.json
  name: wely-realm-settings
# Demo accounts (public credentials): never deleted (wely-users), never erased (wely-events), never
# promoted to community admin on any leave (wely-social) nor handed a deleted organizer's events
# (wely-events). Same ids as DEMO_USER_IDS in demo/demo-reset.yaml; keep both lists in step.
- literals:
  - "protected-user-ids=89a380b8-f66a-44d0-b9d9-616241080430,a0cac685-c593-415d-bd73-6530e25a1f53,\
    9de75282-095c-41a9-ab17-2d58b02445da,50c7b996-ebf8-40e1-a0a5-5dc634f9b793,\
    0fa728fe-fd0e-4997-b226-fd049c6b0659,15d05360-522a-4ff1-93a9-07d63346e4c1,\
    4d6501b7-caed-4a98-b960-199db1bd4106,66e332e6-8d98-49c6-ac22-27095c35cf9d,\
    f4be7974-0ed3-457e-80d3-8aa08e0c5197,cdc6f71d-065c-4af5-9775-692411fc9504"
  name: wely-account-deletion

namespace: wely-dev

namePrefix: dev-

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-web
    spec:
      template:
        spec:
          containers:
          - name: angular-app
            env:
            - name: GATEWAY_URL
              value: "http://dev-wely-gateway-service.wely-dev.svc.cluster.local:8081"
            - name: KEYCLOAK_URL
              value: "https://dev-auth.welylabs.app"
            - name: PUBLIC_URL
              value: "https://dev-web.welylabs.app"
  target:
    kind: Deployment
    name: wely-web
# Keyed by environment-variable name rather than by index, like the wely-chat patch below
# and unlike the rest of this file. The gateway's env list grew when Redis was added, and an
# index patch says nothing about which variable it means — it silently rewrites whatever
# happens to sit at that position.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-gateway
    spec:
      template:
        spec:
          containers:
          - name: gateway
            env:
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
            - name: SOCIAL_API_URL
              value: "http://dev-wely-social-service:8083"
            - name: CHAT_API_URL
              value: "http://dev-wely-chat-service:8084"
            - name: CHAT_RSOCKET_URL
              value: "ws://dev-wely-chat-service:8084"
            - name: EVENTS_API_URL
              value: "http://dev-wely-events-service:8086"
            - name: NOTIFICATIONS_API_URL
              value: "http://dev-wely-notifications-service:8087"
            - name: CORS_ALLOWED_ORIGIN
              value: "https://dev-web.welylabs.app"
            # namePrefix renames the Service but not a value that merely spells its name, so
            # the prefix has to be written out here or the gateway looks up a host that does
            # not exist.
            - name: REDIS_HOST
              value: "dev-wely-redis-service"
            # Swagger UI on, for this environment only. The gateway is the one process the
            # tunnel reaches, so its documentation defaults to off in application.properties.
            - name: SPRINGDOC_ENABLED
              value: "true"
  target:
    kind: Deployment
    name: wely-gateway
# Environment from a Secret is read at start: once each seal or rotation of dev-wely-deleted-users
# is live, one bump in its own commit restarts wely-users and the four readers of its list (README).
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: deleted-users-readers
    spec:
      template:
        metadata:
          annotations:
            wely.dev/deleted-users-key: "0"
  target:
    kind: Deployment
    name: wely-(users|social|chat|events|notifications)
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-users
    spec:
      template:
        spec:
          containers:
          - name: users-api
            env:
            - name: MEDIA_API_URL
              value: "http://dev-wely-media-service:8085"
            - name: SOCIAL_API_URL
              value: "http://dev-wely-social-service:8083"
            - name: DB_URL
              value: "r2dbc:postgresql://dev-wely-postgres-users-service:5432/users"
            - name: DB_JDBC_URL
              value: "jdbc:postgresql://dev-wely-postgres-users-service:5432/users?sslmode=disable"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
            - name: KEYCLOAK_INTERNAL_TOKEN_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/token"
            - name: KEYCLOAK_BASE_URL
              value: "http://dev-wely-auth-service:8080"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "dev-wely-kafka-service:9092"
            # DELETE /profile answers 403 USR-BUS-011 for these accounts.
            - name: ACCOUNT_DELETION_PROTECTED_USER_IDS
              valueFrom:
                configMapKeyRef: { name: wely-account-deletion, key: protected-user-ids }
            # Off by default in wely-users, so an image deployed before this list stays closed.
            - name: ACCOUNT_DELETION_ENABLED
              value: "true"
  target:
    kind: Deployment
    name: wely-users
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-social
    spec:
      template:
        spec:
          containers:
          - name: social
            env:
            - name: NEO4J_URI
              value: "neo4j://dev-wely-neo4j-service:7687"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "dev-wely-kafka-service:9092"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
            # Demo accounts never count as or become community admins, on any leave.
            - name: ACCOUNT_DELETION_PROTECTED_USER_IDS
              valueFrom:
                configMapKeyRef: { name: wely-account-deletion, key: protected-user-ids }
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-social
# Keyed by environment-variable name rather than by index, unlike the patches above.
# The base gained CHAT_BROADCAST_MODE and its Kafka settings, which shifted every index
# after MONGODB_URI, so /env/4 stopped being the Keycloak issuer. A merge patch has no
# positions to fall out of date.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-chat
    spec:
      template:
        metadata:
          annotations:
            # Environment from a Secret is read at start: bumped to restart the pod on new keys.
            wely.dev/calls-keys: "2"
        spec:
          containers:
          - name: chat
            env:
            - name: MEDIA_API_URL
              value: "http://dev-wely-media-service:8085"
            # MONGO_USERNAME and MONGO_PASSWORD are repeated here, unchanged from the base,
            # only to pin their position. Kubernetes expands $(VAR) from variables declared
            # *earlier* in the list and leaves a forward reference as literal text, and a merge
            # patch puts the entries it names first — so without these two, MONGODB_URI would
            # be patched to the front and the pod would try to log in as "$(MONGO_USERNAME)".
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: mongo-root-password
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@dev-wely-mongodb-service:27017/chat_db?authSource=admin"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
            # A topic per environment, so two environments sharing a broker never read each
            # other's records. Created by the topics Job: the binder is not allowed to.
            - name: CHAT_BROADCAST_TOPIC
              value: "DEV_MESSAGE_BROADCAST"
            - name: CHAT_CALL_TOPIC
              value: "DEV_CALL_EVENTS"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "dev-wely-kafka-service:9092"
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-chat
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-events
    spec:
      template:
        spec:
          containers:
          - name: events-api
            env:
            - name: MEDIA_API_URL
              value: "http://dev-wely-media-service:8085"
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  key: mongo-root-username
                  name: dev-wely-secrets-dev
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: mongo-root-password
                  name: dev-wely-secrets-dev
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@dev-wely-mongodb-service:27017/events_db?authSource=admin"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
            # namePrefix renames the Service, not a value that spells its name.
            - name: SOCIAL_API_URL
              value: "http://dev-wely-social-service:8083"
            # Publishes EVENT_GROUP_CHANGED to the in-cluster broker, like wely-users.
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "dev-wely-kafka-service:9092"
            # Demo accounts are never erased nor handed an event by the USER_DELETED consumer.
            - name: ACCOUNT_DELETION_PROTECTED_USER_IDS
              valueFrom:
                configMapKeyRef: { name: wely-account-deletion, key: protected-user-ids }
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-events
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-auth
    spec:
      template:
        spec:
          containers:
          - name: keycloak
            env:
            - name: KC_HOSTNAME
              value: "https://dev-auth.welylabs.app"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "true"
            - name: KC_DB_URL
              value: "jdbc:postgresql://dev-wely-postgres-auth-service:5432/keycloak"
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-auth
- patch: |-
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: wely-kafka
    spec:
      template:
        spec:
          containers:
          - name: kafka
            env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://dev-wely-kafka-service:9092"
  target:
    kind: StatefulSet
    name: wely-kafka
- patch: |-
    # namePrefix renames the Service and the StatefulSet's claim, not values that spell their names.
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/initContainers/0/env/0/value
      value: "dev-wely-garage-0.dev-wely-garage-admin:3903"
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/volumes/0/persistentVolumeClaim/claimName
      value: "garage-data-dev-wely-garage-0"
  target:
    kind: CronJob
    name: wely-garage-backup
- patch: |-
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: wely-garage-setup
    spec:
      template:
        spec:
          containers:
          - name: setup
            env:
            # namePrefix renames the Services, not a value that spells their names.
            - name: GARAGE_ADMIN
              value: "dev-wely-garage-0.dev-wely-garage-admin:3903"
  target:
    kind: Job
    name: wely-garage-setup
- patch: |-
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: wely-kafka-topics
    spec:
      template:
        spec:
          containers:
          - name: topics
            env:
            # namePrefix renames the Service, not a value that spells its name.
            - name: KAFKA_BOOTSTRAP
              value: "dev-wely-kafka-service:9092"
            # NAME:policy, as in the base; the chat's DEV_ topics are live fan-out, read from latest.
            - name: KAFKA_TOPICS
              value: "USER_CREATED:personal USER_DELETED:erasure USER_MODIFIED:personal DEV_MESSAGE_BROADCAST:live DEV_CALL_EVENTS:live EVENT_GROUP_CHANGED EVENT_DATE_FIXED FRIENDSHIP_CHANGED:personal USER_BIRTHDAY:personal BIRTHDAY_NOTICES:personal FRIENDSHIP_NOTICES:personal"
  target:
    kind: Job
    name: wely-kafka-topics
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-kafka-ui
    spec:
      template:
        spec:
          containers:
          - name: kafka-ui
            env:
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "dev-wely-kafka-service:9092"
  target:
    kind: Deployment
    name: wely-kafka-ui

- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-media
    spec:
      template:
        spec:
          containers:
          - name: media
            env:
            - name: MEDIA_INTERNAL_ENDPOINT
              value: "http://dev-wely-garage-service:3900"
            # The public host the signed URLs name: the signature covers it.
            - name: MEDIA_PUBLIC_ENDPOINT
              value: "https://dev-media.welylabs.app"
  target:
    kind: Deployment
    name: wely-media
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-notifications
    spec:
      template:
        metadata:
          annotations:
            # An optional secret is read at pod start: bump this once the APNs key is sealed.
            wely.dev/apns-keys: "0"
        spec:
          containers:
          - name: notifications-api
            env:
            # Repeated before MONGODB_URI, which expands them: a patch moves the entries it names first.
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  key: mongo-root-username
                  name: dev-wely-secrets-dev
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: mongo-root-password
                  name: dev-wely-secrets-dev
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@dev-wely-mongodb-service:27017/notifications_db?authSource=admin"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "dev-wely-kafka-service:9092"
            # The chat's own dev topics.
            - name: CALL_EVENTS_TOPIC
              value: "DEV_CALL_EVENTS"
            - name: MESSAGE_BROADCAST_TOPIC
              value: "DEV_MESSAGE_BROADCAST"
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-notifications
