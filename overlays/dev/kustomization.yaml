apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- namespace.yaml
- wely-sealed-secrets-dev.yaml
# The per-service X-Internal-Secret of wely-media, sealed apart from the shared secret (see
# base/wely-secrets.example.yaml, second document). Still named dev-wely-garage after the storage that
# held the pictures until 2026-11-15: a SealedSecret only decrypts for its original name, so the
# rename waits for the next reseal of these four values.
- wely-sealed-garage-dev.yaml
# Cloudflare Realtime keys for calls (SFU and TURN), read by wely-chat only.
- wely-sealed-calls-dev.yaml
# VAPID keys of wely-notifications (Web Push).
- wely-sealed-notifications-dev.yaml
# Credentials of the managed cloud services (Atlas...), sealed with seal-cloud-secret.sh.
- wely-sealed-cloud-dev.yaml
# Guards GET /user-service/internal/**, and the four readers of the tombstones send it back.
# Sealed with seal-deleted-users-secret.sh. It had never been created: wely-users fell back to an
# empty reader secret, which by design answers 401, and every reconciliation pass failed hourly.
- wely-sealed-deleted-users-dev.yaml
- pod-disruption-budgets.yaml
- demo/demo-reset.yaml
# Observability moved to observability/shared, in wely-observability: it watches the
# environments rather than belonging to one. It reads this namespace's pods through a Role
# granted there — see base/prometheus-rbac.yaml, placed in this namespace by the transformer
# below, and observability/shared/ for the scraper itself.

# Dataset of the public demo account, replayed nightly by demo/demo-reset.yaml.
configMapGenerator:
- files:
  - demo/seed-users.sql
  - demo/seed-social.cypher
  - demo/seed-mongo.js
  name: wely-demo-seed
# Demo accounts (public credentials): never deleted (wely-users), never erased (wely-events), never
# promoted to community admin on any leave (wely-social) nor handed a deleted organizer's events
# (wely-events). Same ids as DEMO_USER_IDS in demo/demo-reset.yaml; keep both lists in step.
- literals:
  - "protected-user-ids=89a380b8-f66a-44d0-b9d9-616241080430,a0cac685-c593-415d-bd73-6530e25a1f53,\
    9de75282-095c-41a9-ab17-2d58b02445da,50c7b996-ebf8-40e1-a0a5-5dc634f9b793,\
    0fa728fe-fd0e-4997-b226-fd049c6b0659,15d05360-522a-4ff1-93a9-07d63346e4c1,\
    4d6501b7-caed-4a98-b960-199db1bd4106,66e332e6-8d98-49c6-ac22-27095c35cf9d,\
    f4be7974-0ed3-457e-80d3-8aa08e0c5197,cdc6f71d-065c-4af5-9775-692411fc9504"
  name: wely-account-deletion

namespace: wely-dev

namePrefix: dev-

patches:
# Placement. Everything of this namespace runs on the workload node, data and services
# together: serverwely1 has an SSD where the Pi writes to an SD card — the component that dies
# first on these machines, and the one Kafka, Postgres, Mongo and Neo4j write to continuously —
# plus 11.6 Gi allocatable against the Pi's 7.9, which is already at 99% of its memory limits.
# Observability went the other way, onto pi5: a scraper that lives on the node it watches is a
# scraper you lose together with the node. The two roles are one label with two values, so the
# swap is two `kubectl label` calls and no manifest change.
#
# A blanket patch rather than a nodeSelector per file: new workloads land on the right node
# without anyone remembering to add it, which is how the orphan-patch class of bug starts.
- patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        wely.dev/role: workload
  target:
    kind: Deployment
- patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        wely.dev/role: workload
  target:
    kind: StatefulSet
# Two of each stateless service, one on each mini PC (role=workload): losing a node leaves every service
# up. DoNotSchedule rather than ScheduleAnyway, or the scheduler may put both on one node and the pair
# protects nothing; while a node is down, the second pod waits Pending. pod-template-hash is unique to
# each Deployment's revision, so it narrows the count to the pod's own service and spreads a rollout's
# new pods among themselves. A key cannot be both there and in labelSelector: the API refuses the pod.
# Not doubled: wely-mcp (STREAMABLE MCP keeps its sessions in the pod's memory), Redis (stateful, one
# copy).
- patch: |-
    - op: add
      path: /spec/replicas
      value: 2
    - op: add
      path: /spec/template/spec/topologySpreadConstraints
      value:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchExpressions:
              - { key: app, operator: Exists }
          matchLabelKeys: [pod-template-hash]
  target:
    kind: Deployment
    name: (cloudflared-connector|wely-(gateway|web|users|social|chat|events|notifications|media))
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-web
    spec:
      template:
        spec:
          containers:
          - name: angular-app
            env:
            - name: GATEWAY_URL
              value: "http://dev-wely-gateway-service.wely-dev.svc.cluster.local:8081"
            # Injected into index.html by entrypoint.sh: one image serves every environment, so the
            # tenant, the client and the audience cannot be constants in the bundle.
            - name: AUTH_DOMAIN
              value: "auth.welylabs.app"
            - name: AUTH_CLIENT_ID
              value: "a3HWp7xp83GIpuOyxjAoGfKHvFW44PK7"
            - name: AUTH_AUDIENCE
              value: "wely-api-dev"
            - name: PUBLIC_URL
              value: "https://dev-web.welylabs.app"
  target:
    kind: Deployment
    name: wely-web
# Keyed by environment-variable name rather than by index, like the wely-chat patch below
# and unlike the rest of this file. The gateway's env list grew when Redis was added, and an
# index patch says nothing about which variable it means — it silently rewrites whatever
# happens to sit at that position.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-gateway
    spec:
      template:
        spec:
          containers:
          - name: gateway
            env:
            - name: OIDC_ISSUER_URI
              value: "https://auth.welylabs.app/"
            - name: JWT_AUDIENCES
              value: "wely-api-dev"
            - name: OIDC_JWK_SET_URI
              value: "https://auth.welylabs.app/.well-known/jwks.json"
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
            - name: SOCIAL_API_URL
              value: "http://dev-wely-social-service:8083"
            - name: CHAT_API_URL
              value: "http://dev-wely-chat-service:8084"
            - name: CHAT_RSOCKET_URL
              value: "ws://dev-wely-chat-service:8084"
            - name: EVENTS_API_URL
              value: "http://dev-wely-events-service:8086"
            - name: NOTIFICATIONS_API_URL
              value: "http://dev-wely-notifications-service:8087"
            - name: CORS_ALLOWED_ORIGIN
              value: "https://dev-web.welylabs.app"
            # namePrefix renames the Service but not a value that merely spells its name, so
            # the prefix has to be written out here or the gateway looks up a host that does
            # not exist.
            - name: REDIS_HOST
              value: "dev-wely-redis-service"
            # Swagger UI on, for this environment only. The gateway is the one process the
            # tunnel reaches, so its documentation defaults to off in application.properties.
            - name: SPRINGDOC_ENABLED
              value: "true"
  target:
    kind: Deployment
    name: wely-gateway
# Environment from a Secret is read at start: once each seal or rotation of dev-wely-deleted-users
# is live, one bump in its own commit restarts wely-users and the four readers of its list (README).
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: deleted-users-readers
    spec:
      template:
        metadata:
          annotations:
            wely.dev/deleted-users-key: "0"
  target:
    kind: Deployment
    name: wely-(users|social|chat|events|notifications)
# Same for media-secret-social in dev-wely-garage: once it is sealed and live, one bump in its own
# commit restarts wely-media and wely-social, its two readers.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: media-social-readers
    spec:
      template:
        metadata:
          annotations:
            wely.dev/media-social-key: "0"
  target:
    kind: Deployment
    name: wely-(media|social)
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-users
    spec:
      template:
        spec:
          containers:
          - name: users-api
            env:
            - name: MEDIA_API_URL
              value: "http://dev-wely-media-service:8085"
            - name: SOCIAL_API_URL
              value: "http://dev-wely-social-service:8083"
            # PostgreSQL is on Neon (project wely-dev, branch dev, role wely-users), the password sealed in
            # wely-sealed-cloud-dev.yaml. verify-full checks Neon's certificate and host name against the
            # JDK's CAs, for R2DBC (sslMode, application.properties) and for Flyway's JDBC URL alike.
            - name: DB_URL
              value: "r2dbc:postgresql://ep-old-breeze-b947m9wm.c-7.eu-central-1.aws.neon.tech/users"
            - name: DB_JDBC_URL
              value: "jdbc:postgresql://ep-old-breeze-b947m9wm.c-7.eu-central-1.aws.neon.tech/users?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory"
            - name: DB_USERNAME
              value: "wely-users"
              valueFrom: null
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: users-db-password }
            # The base disables R2DBC's TLS for the in-cluster PostgreSQL; Neon refuses plain connections
            # ("connection is insecure"), so application.properties' verify-full applies instead.
            - name: SPRING_R2DBC_PROPERTIES_SSLMODE
              $patch: delete
            - name: OIDC_ISSUER_URI
              value: "https://auth.welylabs.app/"
            - name: JWT_AUDIENCES
              value: "wely-api-dev"
            - name: OIDC_JWK_SET_URI
              value: "https://auth.welylabs.app/.well-known/jwks.json"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "pkc-921jm.us-east-2.aws.confluent.cloud:9092"
            # Confluent Cloud, cluster wely-dev-kafka: SASL_SSL as the service account wely-dev-services.
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: KAFKA_API_KEY
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: kafka-api-key }
            - name: KAFKA_API_SECRET
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: kafka-api-secret }
            # A topic per environment, so two environments sharing the broker never read each
            # other's records. Created by the topics Job: the binder is not allowed to.
            - name: TOPIC_PREFIX
              value: "dev."
            # DELETE /profile answers 403 USR-BUS-011 for these accounts.
            - name: ACCOUNT_DELETION_PROTECTED_USER_IDS
              valueFrom:
                configMapKeyRef: { name: wely-account-deletion, key: protected-user-ids }
            # Off by default in wely-users, so an image deployed before this list stays closed.
            - name: ACCOUNT_DELETION_ENABLED
              value: "true"
  target:
    kind: Deployment
    name: wely-users
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-social
    spec:
      template:
        spec:
          containers:
          - name: social
            env:
            # Neo4j is on Aura (AuraDB Free, instance wely-dev), the password sealed in
            # wely-sealed-cloud-dev.yaml. neo4j+s: TLS with the certificate checked.
            - name: NEO4J_URI
              value: "neo4j+s://870a5eb0.databases.neo4j.io"
            - name: NEO4J_USERNAME
              value: "870a5eb0"
              valueFrom: null
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: neo4j-password }
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "pkc-921jm.us-east-2.aws.confluent.cloud:9092"
            # Confluent Cloud, cluster wely-dev-kafka: SASL_SSL as the service account wely-dev-services.
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: KAFKA_API_KEY
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: kafka-api-key }
            - name: KAFKA_API_SECRET
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: kafka-api-secret }
            # A topic per environment, so two environments sharing the broker never read each
            # other's records. Created by the topics Job: the binder is not allowed to.
            - name: TOPIC_PREFIX
              value: "dev."
            - name: OIDC_ISSUER_URI
              value: "https://auth.welylabs.app/"
            - name: JWT_AUDIENCES
              value: "wely-api-dev"
            - name: OIDC_JWK_SET_URI
              value: "https://auth.welylabs.app/.well-known/jwks.json"
            # Demo accounts never count as or become community admins, on any leave.
            - name: ACCOUNT_DELETION_PROTECTED_USER_IDS
              valueFrom:
                configMapKeyRef: { name: wely-account-deletion, key: protected-user-ids }
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
            - name: MEDIA_API_URL
              value: "http://dev-wely-media-service:8085"
  target:
    kind: Deployment
    name: wely-social
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-mcp
    spec:
      template:
        spec:
          containers:
          - name: mcp
            env:
            - name: MCP_PUBLIC_URL
              value: "https://dev-mcp.welylabs.app"
            - name: GATEWAY_URL
              value: "http://dev-wely-gateway-service:8081"
            - name: OIDC_ISSUER_URI
              value: "https://auth.welylabs.app/"
            - name: JWT_AUDIENCES
              value: "wely-api-dev"
            - name: OIDC_JWK_SET_URI
              value: "https://auth.welylabs.app/.well-known/jwks.json"
  target:
    kind: Deployment
    name: wely-mcp
# Keyed by environment-variable name rather than by index, unlike the patches above.
# The base gained CHAT_BROADCAST_MODE and its Kafka settings, which shifted every index
# after MONGODB_URI, so /env/4 stopped being the token issuer. A merge patch has no
# positions to fall out of date.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-chat
    spec:
      template:
        metadata:
          annotations:
            # Environment from a Secret is read at start: bumped to restart the pod on new keys.
            wely.dev/calls-keys: "2"
        spec:
          containers:
          - name: chat
            env:
            - name: MEDIA_API_URL
              value: "http://dev-wely-media-service:8085"
            # MongoDB is on Atlas (project wely-dev), sealed in wely-sealed-cloud-dev.yaml. value: null drops
            # the base's in-cluster URI, which would otherwise sit next to valueFrom; the two base
            # credentials it expanded are deleted with it.
            - name: MONGO_USERNAME
              $patch: delete
            - name: MONGO_PASSWORD
              $patch: delete
            - name: MONGODB_URI
              value: null
              valueFrom:
                secretKeyRef:
                  name: dev-wely-cloud
                  key: mongodb-uri-chat
            - name: OIDC_ISSUER_URI
              value: "https://auth.welylabs.app/"
            - name: JWT_AUDIENCES
              value: "wely-api-dev"
            - name: OIDC_JWK_SET_URI
              value: "https://auth.welylabs.app/.well-known/jwks.json"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "pkc-921jm.us-east-2.aws.confluent.cloud:9092"
            # Confluent Cloud, cluster wely-dev-kafka: SASL_SSL as the service account wely-dev-services.
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: KAFKA_API_KEY
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: kafka-api-key }
            - name: KAFKA_API_SECRET
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: kafka-api-secret }
            # A topic per environment, so two environments sharing the broker never read each
            # other's records. Created by the topics Job: the binder is not allowed to.
            - name: TOPIC_PREFIX
              value: "dev."
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-chat
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-events
    spec:
      template:
        spec:
          containers:
          - name: events-api
            env:
            - name: MEDIA_API_URL
              value: "http://dev-wely-media-service:8085"
            # MongoDB is on Atlas (project wely-dev), sealed in wely-sealed-cloud-dev.yaml. value: null drops
            # the base's in-cluster URI, which would otherwise sit next to valueFrom; the two base
            # credentials it expanded are deleted with it.
            - name: MONGO_USERNAME
              $patch: delete
            - name: MONGO_PASSWORD
              $patch: delete
            - name: MONGODB_URI
              value: null
              valueFrom:
                secretKeyRef:
                  name: dev-wely-cloud
                  key: mongodb-uri-events
            - name: OIDC_ISSUER_URI
              value: "https://auth.welylabs.app/"
            - name: JWT_AUDIENCES
              value: "wely-api-dev"
            - name: OIDC_JWK_SET_URI
              value: "https://auth.welylabs.app/.well-known/jwks.json"
            # namePrefix renames the Service, not a value that spells its name.
            - name: SOCIAL_API_URL
              value: "http://dev-wely-social-service:8083"
            # Publishes EVENT_GROUP_CHANGED to the broker, like wely-users.
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "pkc-921jm.us-east-2.aws.confluent.cloud:9092"
            # Confluent Cloud, cluster wely-dev-kafka: SASL_SSL as the service account wely-dev-services.
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: KAFKA_API_KEY
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: kafka-api-key }
            - name: KAFKA_API_SECRET
              valueFrom:
                secretKeyRef: { name: dev-wely-cloud, key: kafka-api-secret }
            # A topic per environment, so two environments sharing the broker never read each
            # other's records. Created by the topics Job: the binder is not allowed to.
            - name: TOPIC_PREFIX
              value: "dev."
            # Demo accounts are never erased nor handed an event by the USER_DELETED consumer.
            - name: ACCOUNT_DELETION_PROTECTED_USER_IDS
              valueFrom:
                configMapKeyRef: { name: wely-account-deletion, key: protected-user-ids }
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
  target:
