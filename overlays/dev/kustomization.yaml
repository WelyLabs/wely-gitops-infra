patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-web
    spec:
      template:
        spec:
          containers:
          - name: angular-app
            env:
            - name: GATEWAY_URL
              value: "http://dev-wely-gateway-service.wely-dev.svc.cluster.local:8081"
            - name: KEYCLOAK_URL
              value: "https://dev-auth.welylabs.app"
            - name: PUBLIC_URL
              value: "https://dev-web.welylabs.app"
  target:
    kind: Deployment
    name: wely-web
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-gateway
    spec:
      template:
        spec:
          containers:
          - name: gateway
            env:
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
            - name: SOCIAL_API_URL
              value: "http://dev-wely-social-service:8083"
            - name: CHAT_API_URL
              value: "http://dev-wely-chat-service:8084"
            - name: CHAT_RSOCKET_URL
              value: "ws://dev-wely-chat-service:8084"
            - name: EVENTS_API_URL
              value: "http://dev-wely-events-service:8086"
            - name: CORS_ALLOWED_ORIGIN
              value: "https://dev-web.welylabs.app"
            # namePrefix renames the Service but not a value that merely spells its name, so
            # the prefix has to be written out here or the gateway looks up a host that does
            # not exist.
            - name: REDIS_HOST
              value: "dev-wely-redis-service"
            # Swagger UI on, for this environment only. The gateway is the one process the
            # tunnel reaches, so its documentation defaults to off in application.properties.
            - name: SPRINGDOC_ENABLED
              value: "true"
  target:
    kind: Deployment
    name: wely-gateway
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-users
    spec:
      template:
        spec:
          containers:
          - name: users-api
            env:
            - name: DB_URL
              value: "r2dbc:postgresql://dev-wely-postgres-users-service:5432/users"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
            - name: KEYCLOAK_INTERNAL_TOKEN_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/token"
            - name: KEYCLOAK_BASE_URL
              value: "http://dev-wely-auth-service:8080"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "dev-wely-kafka-service:9092"
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: "PLAINTEXT"
            - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_CONFIGURATION_SECURITY_PROTOCOL
              value: "PLAINTEXT"
  target:
    kind: Deployment
    name: wely-users
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-social
    spec:
      template:
        spec:
          containers:
          - name: social
            env:
            - name: NEO4J_URI
              value: "neo4j://dev-wely-neo4j-service:7687"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "dev-wely-kafka-service:9092"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: "PLAINTEXT"
            - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_CONFIGURATION_SECURITY_PROTOCOL
              value: "PLAINTEXT"
  target:
    kind: Deployment
    name: wely-social
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-chat
    spec:
      template:
        spec:
          containers:
          - name: chat
            env:
            # MONGO_USERNAME and MONGO_PASSWORD are repeated here, unchanged from the base,
            # only to pin their position. Kubernetes expands $(VAR) from variables declared
            # *earlier* in the list and leaves a forward reference as literal text, and a merge
            # patch puts the entries it names first — so without these two, MONGODB_URI would
            # be patched to the front and the pod would try to log in as "$(MONGO_USERNAME)".
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: mongo-root-password
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@dev-wely-mongodb-service:27017/chat_db?authSource=admin"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
            # dev and prod share one Confluent cluster, so they need separate topics: the
            # user ids on the records come from the same Keycloak realm, and a dev pod
            # reading prod's topic would deliver prod messages to a dev client. Create it
            # first — the binder is not allowed to.
            - name: CHAT_BROADCAST_TOPIC
              value: "DEV_MESSAGE_BROADCAST"
            # The in-cluster broker, like wely-social and wely-users. The base still carries the
            # Confluent Cloud address, which is what wely-chat was pointed at by mistake: the
            # value was copied from the base without noticing this overlay had already moved the
            # other two off it. Nothing in dev reaches Confluent any more.
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "dev-wely-kafka-service:9092"
            # The in-cluster broker speaks PLAINTEXT; the SASL settings in application.properties
            # are for Confluent and are ignored once the protocol is not SASL_SSL.
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: "PLAINTEXT"
            - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_CONFIGURATION_SECURITY_PROTOCOL
              value: "PLAINTEXT"
  target:
    kind: Deployment
    name: wely-chat
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-events
    spec:
      template:
        spec:
          containers:
          - name: events-api
            env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  key: mongo-root-username
                  name: dev-wely-secrets-dev
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: mongo-root-password
                  name: dev-wely-secrets-dev
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@dev-wely-mongodb-service:27017/events_db?authSource=admin"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/wely-realm"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
  target:
    kind: Deployment
    name: wely-events
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-auth
    spec:
      template:
        spec:
          containers:
          - name: keycloak
            env:
            - name: KC_HOSTNAME
              value: "https://dev-auth.welylabs.app"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "true"
            - name: KC_DB_URL
              value: "jdbc:postgresql://dev-wely-postgres-auth-service:5432/keycloak"
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-auth
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-kafka
    spec:
      template:
        spec:
          containers:
          - name: kafka
            env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://dev-wely-kafka-service:9092"
  target:
    kind: Deployment
    name: wely-kafka
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-kafka-ui
    spec:
      template:
        spec:
          containers:
          - name: kafka-ui
            env:
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "dev-wely-kafka-service:9092"
  target:
    kind: Deployment
    name: wely-kafka-ui

