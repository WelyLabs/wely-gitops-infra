apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- namespace.yaml
- wely-sealed-secrets-dev.yaml

namespace: wely-dev

namePrefix: dev-

# Keyed by environment-variable name rather than by index, like the wely-chat patch below
# and unlike the rest of this file. The gateway's env list grew when Redis was added, and an
# index patch says nothing about which variable it means — it silently rewrites whatever
# happens to sit at that position.
            # namePrefix renames the Service but not a value that merely spells its name, so
            # the prefix has to be written out here or the gateway looks up a host that does
            # not exist.
# Keyed by environment-variable name rather than by index, unlike the patches above.
# The base gained CHAT_BROADCAST_MODE and its Kafka settings, which shifted every index
# after MONGODB_URI, so /env/4 stopped being the Keycloak issuer. A merge patch has no
# positions to fall out of date.
            # MONGO_USERNAME and MONGO_PASSWORD are repeated here, unchanged from the base,
            # only to pin their position. Kubernetes expands $(VAR) from variables declared
            # *earlier* in the list and leaves a forward reference as literal text, and a merge
            # patch puts the entries it names first — so without these two, MONGODB_URI would
            # be patched to the front and the pod would try to log in as "$(MONGO_USERNAME)".
            # dev and prod share one Confluent cluster, so they need separate topics: the
            # user ids on the records come from the same Keycloak realm, and a dev pod
            # reading prod's topic would deliver prod messages to a dev client. Create it
            # first — the binder is not allowed to.
            # namePrefix renames the Service but not a value that merely spells its name, so
            # the prefix has to be written out here or the gateway looks up a host that does
            # not exist.
            # MONGO_USERNAME and MONGO_PASSWORD are repeated here, unchanged from the base,
            # only to pin their position. Kubernetes expands $(VAR) from variables declared
            # *earlier* in the list and leaves a forward reference as literal text, and a merge
            # patch puts the entries it names first — so without these two, MONGODB_URI would
            # be patched to the front and the pod would try to log in as "$(MONGO_USERNAME)".
            # dev and prod share one Confluent cluster, so they need separate topics: the
            # user ids on the records come from the same Keycloak realm, and a dev pod
            # reading prod's topic would deliver prod messages to a dev client. Create it
            # first — the binder is not allowed to.
patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: "http://dev-wely-gateway-service.wely-dev.svc.cluster.local:8081"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: KEYCLOAK_URL
        value: "https://dev-auth.welylabs.app"
  target:
    kind: Deployment
    name: wely-web
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-gateway
    spec:
      template:
        spec:
          containers:
          - name: gateway
            env:
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/calendar-app"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
            - name: USERS_API_URL
              value: "http://dev-wely-users-service:8082"
            - name: SOCIAL_API_URL
              value: "http://dev-wely-social-service:8083"
            - name: CHAT_API_URL
              value: "http://dev-wely-chat-service:8084"
            - name: CHAT_RSOCKET_URL
              value: "ws://dev-wely-chat-service:8084"
            - name: EVENTS_API_URL
              value: "http://dev-wely-events-service:8086"
            - name: CORS_ALLOWED_ORIGIN
              value: "https://dev-web.welylabs.app"
            # namePrefix renames the Service but not a value that merely spells its name, so
            # the prefix has to be written out here or the gateway looks up a host that does
            # not exist.
            - name: REDIS_HOST
              value: "dev-wely-redis-service"
  target:
    kind: Deployment
    name: wely-gateway
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "r2dbc:postgresql://dev-wely-postgres-users-service:5432/users"
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "https://dev-auth.welylabs.app/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/token"
    - op: replace
      path: /spec/template/spec/containers/0/env/6/value
      value: "http://dev-wely-auth-service:8080"
    - op: replace
      path: /spec/template/spec/containers/0/env/9/value
      value: "dev-wely-kafka-service:9092"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
        value: "PLAINTEXT"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_CLOUD_STREAM_KAFKA_BINDER_CONFIGURATION_SECURITY_PROTOCOL
        value: "PLAINTEXT"
  target:
    kind: Deployment
    name: wely-users
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "neo4j://dev-wely-neo4j-service:7687"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "dev-wely-kafka-service:9092"
    - op: replace
      path: /spec/template/spec/containers/0/env/7/value
      value: "https://dev-auth.welylabs.app/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/8/value
      value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
        value: "PLAINTEXT"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_CLOUD_STREAM_KAFKA_BINDER_CONFIGURATION_SECURITY_PROTOCOL
        value: "PLAINTEXT"
  target:
    kind: Deployment
    name: wely-social
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-chat
    spec:
      template:
        spec:
          containers:
          - name: chat
            env:
            # MONGO_USERNAME and MONGO_PASSWORD are repeated here, unchanged from the base,
            # only to pin their position. Kubernetes expands $(VAR) from variables declared
            # *earlier* in the list and leaves a forward reference as literal text, and a merge
            # patch puts the entries it names first — so without these two, MONGODB_URI would
            # be patched to the front and the pod would try to log in as "$(MONGO_USERNAME)".
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: mongo-root-password
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@dev-wely-mongodb-service:27017/chat_db?authSource=admin"
            - name: KEYCLOAK_ISSUER_URI
              value: "https://dev-auth.welylabs.app/realms/calendar-app"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
            # dev and prod share one Confluent cluster, so they need separate topics: the
            # user ids on the records come from the same Keycloak realm, and a dev pod
            # reading prod's topic would deliver prod messages to a dev client. Create it
            # first — the binder is not allowed to.
            - name: CHAT_BROADCAST_TOPIC
              value: "DEV_MESSAGE_BROADCAST"
  target:
    kind: Deployment
    name: wely-chat
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@dev-wely-mongodb-service:27017/events_db?authSource=admin"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "https://dev-auth.welylabs.app/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "http://dev-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
  target:
    kind: Deployment
    name: wely-events
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "https://dev-auth.welylabs.app"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "true"
    - op: replace
      path: /spec/template/spec/containers/0/env/7/value
      value: "jdbc:postgresql://dev-wely-postgres-auth-service:5432/keycloak"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: USERS_API_URL
        value: "http://dev-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-auth
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "PLAINTEXT://dev-wely-kafka-service:9092"
  target:
    kind: Deployment
    name: wely-kafka
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: "dev-wely-kafka-service:9092"
  target:
    kind: Deployment
    name: wely-kafka-ui

images:
- name: ghcr.io/welylabs/wely-chat
  newName: ghcr.io/welylabs/wely-chat
  newTag: sha-1c6c4fc14064d875f1760c1c6534be78cc1eae3c
- name: ghcr.io/welylabs/wely-events
