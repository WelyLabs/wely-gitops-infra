apiVersion: v1
kind: Secret
metadata:
  name: dev-wely-secrets-dev
type: Opaque
stringData:
  # Auth Database
  auth-db-username: keycloak
  auth-db-password: local-secret-kc
  
  # Keycloak Admin & Client
  kc-admin-username: admin
  kc-admin-password: admin
  kc-client-secret: local-secret-kc-client
  
  # Users Database
  users-db-username: users
  users-db-password: local-secret-users
  
  # Neo4j Database
  neo4j-username: neo4j
  neo4j-password: local-secret-neo4j
  
  # MongoDB Database
  mongo-root-username: admin
  mongo-root-password: local-secret-mongo
  
  # Kafka
  # The local overlay runs its own Kafka in PLAINTEXT, so these are unused
  # placeholders. Never put real Confluent credentials here: this file is tracked.
  kafka-key: local-kafka-key
  kafka-secret: local-kafka-secret
  
  # Shared secret for the internal /profile/resolve endpoint, read by
  # users-api (app.internal-secret) and the Keycloak BusinessIdMapper plugin.
  internal-secret: local-internal-secret

  # Tailscale Operator (OAuth)
  tailscale-client-id: "placeholder-id"
  tailscale-client-secret: "placeholder-secret"
