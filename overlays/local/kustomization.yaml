apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
# Keycloak and Kafka, which base no longer carries: on a throwaway cluster they live in the same
# namespace as everything else, and namePrefix gives them the local- names the patches below
# already expect. This overlay is also what proves the realm export can build a realm from
# nothing — the shared instance on the Pi never recreates one.
- ../../platform/base
- wely-secrets-local.yaml
- wely-garage-local.yaml
- wely-deleted-users-local.yaml
- namespace.yaml
- wely-users-alias.yaml

namespace: wely-local

namePrefix: local-

configMapGenerator:
# The realm imported at startup: a copy of wely-identity's export, with the client URLs
# pointed at localhost (nginx on :80, ng serve on :4200).
- name: keycloak-realm
  files:
  - keycloak/wely-realm.json

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-web
    spec:
      template:
        spec:
          containers:
          - name: angular-app
            env:
            - name: GATEWAY_URL
              value: "http://local-wely-gateway-service.wely-local.svc.cluster.local:8081"
            - name: KEYCLOAK_URL
              value: "http://localhost:8080"
  target:
    kind: Deployment
    name: wely-web
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
  target:
    kind: Service
    name: wely-garage-service
- patch: |-
    # namePrefix renames the Service and the StatefulSet's claim, not values that spell their names.
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/initContainers/0/env/0/value
      value: "local-wely-garage-0.local-wely-garage-admin:3903"
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/volumes/0/persistentVolumeClaim/claimName
      value: "garage-data-local-wely-garage-0"
  target:
    kind: CronJob
    name: wely-garage-backup
- patch: |-
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: wely-garage-setup
    spec:
      template:
        spec:
          containers:
          - name: setup
            env:
            - name: GARAGE_ADMIN
              value: "local-wely-garage-0.local-wely-garage-admin:3903"
  target:
    kind: Job
    name: wely-garage-setup
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
  target:
    kind: Service
    name: wely-web-service
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
  target:
    kind: Service
    name: wely-gateway-service
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
  target:
    kind: Service
    name: wely-auth-service
# Keyed by environment-variable name rather than by index, like the wely-chat patch below
# and unlike the rest of this file. The gateway's env list grew when Redis was added, and an
# index patch says nothing about which variable it means — it silently rewrites whatever
# happens to sit at that position.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-gateway
    spec:
      template:
        spec:
          containers:
          - name: gateway
            env:
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/wely-local"
            # Empty on purpose: the export still carries the old audience mapper, so a local token
            # has no aud to check. Fixing the export is what will also prove it can build a working
            # realm from nothing.
            - name: JWT_AUDIENCES
              value: ""
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://local-wely-auth-service:8080/realms/wely-local/protocol/openid-connect/certs"
            - name: USERS_API_URL
              value: "http://local-wely-users-service:8082"
            - name: SOCIAL_API_URL
              value: "http://local-wely-social-service:8083"
            - name: CHAT_API_URL
              value: "http://local-wely-chat-service:8084"
            - name: CHAT_RSOCKET_URL
              value: "ws://local-wely-chat-service:8084"
            - name: EVENTS_API_URL
              value: "http://local-wely-events-service:8086"
            - name: NOTIFICATIONS_API_URL
              value: "http://local-wely-notifications-service:8087"
            - name: CORS_ALLOWED_ORIGIN
              value: "http://localhost,http://localhost:80,http://localhost:4200"
            # namePrefix renames the Service but not a value that merely spells its name, so
            # the prefix has to be written out here or the gateway looks up a host that does
            # not exist.
            - name: REDIS_HOST
              value: "local-wely-redis-service"
            # Swagger UI on, for this environment only. The gateway is the one process the
            # tunnel reaches, so its documentation defaults to off in application.properties.
            - name: SPRINGDOC_ENABLED
              value: "true"
  target:
    kind: Deployment
    name: wely-gateway
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-users
    spec:
      template:
        spec:
          containers:
          - name: users-api
            env:
            - name: MEDIA_API_URL
              value: "http://local-wely-media-service:8085"
            - name: SOCIAL_API_URL
              value: "http://local-wely-social-service:8083"
            - name: DB_URL
              value: "r2dbc:postgresql://local-wely-postgres-users-service:5432/users"
            - name: DB_JDBC_URL
              value: "jdbc:postgresql://local-wely-postgres-users-service:5432/users?sslmode=disable"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/wely-local"
            # Empty on purpose: the export still carries the old audience mapper, so a local token
            # has no aud to check. Fixing the export is what will also prove it can build a working
            # realm from nothing.
            - name: JWT_AUDIENCES
              value: ""
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://local-wely-auth-service:8080/realms/wely-local/protocol/openid-connect/certs"
            - name: KEYCLOAK_INTERNAL_TOKEN_URI
              value: "http://local-wely-auth-service:8080/realms/wely-local/protocol/openid-connect/token"
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: "wely-users-local-client"
            - name: KEYCLOAK_BASE_URL
              value: "http://local-wely-auth-service:8080"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "local-wely-kafka-service:9092"
            - name: TOPIC_PREFIX
              value: "local."
            # Account deletion is off by default in wely-users; local has no demo account to protect.
            - name: ACCOUNT_DELETION_ENABLED
              value: "true"
  target:
    kind: Deployment
    name: wely-users
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-social
    spec:
      template:
        spec:
          containers:
          - name: social
            env:
            - name: NEO4J_URI
              value: "neo4j://local-wely-neo4j-service:7687"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "local-wely-kafka-service:9092"
            - name: TOPIC_PREFIX
              value: "local."
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/wely-local"
            # Empty on purpose: the export still carries the old audience mapper, so a local token
            # has no aud to check. Fixing the export is what will also prove it can build a working
            # realm from nothing.
            - name: JWT_AUDIENCES
              value: ""
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://local-wely-auth-service:8080/realms/wely-local/protocol/openid-connect/certs"
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://local-wely-users-service:8082"
            - name: MEDIA_API_URL
              value: "http://local-wely-media-service:8085"
  target:
    kind: Deployment
    name: wely-social
# Keyed by environment-variable name rather than by index, unlike the patches above.
# The base gained CHAT_BROADCAST_MODE and its Kafka settings, which shifted every index
# after MONGODB_URI: /env/4 stopped being the Keycloak issuer and this overlay silently
# rewrote the wrong variable. A merge patch has no positions to get out of date.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-chat
    spec:
      # One replica here, which is the only configuration in which in-process delivery is
      # correct. The alternative would be broadcast mode kafka against the local broker,
      # and that needs MESSAGE_BROADCAST created by hand because the binder is not allowed
      # to create topics.
      replicas: 1
      template:
        spec:
          containers:
          - name: chat
            env:
            - name: MEDIA_API_URL
              value: "http://local-wely-media-service:8085"
            - name: CHAT_BROADCAST_MODE
              value: "local"
            # Unused at mode local, since no binder is created. Overridden anyway so that
            # nothing in the local overlay points at cloud infrastructure.
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "local-wely-kafka-service:9092"
            - name: TOPIC_PREFIX
              value: "local."
            # MONGO_USERNAME and MONGO_PASSWORD are repeated here, unchanged from the base,
            # only to pin their position. Kubernetes expands $(VAR) from variables declared
            # *earlier* in the list and leaves a forward reference as literal text, and a merge
            # patch puts the entries it names first — so without these two, MONGODB_URI would
            # be patched to the front and the pod would try to log in as "$(MONGO_USERNAME)".
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: mongo-root-password
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@local-wely-mongodb-service:27017/chat_db?authSource=admin"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/wely-local"
            # Empty on purpose: the export still carries the old audience mapper, so a local token
            # has no aud to check. Fixing the export is what will also prove it can build a working
            # realm from nothing.
            - name: JWT_AUDIENCES
              value: ""
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://local-wely-auth-service:8080/realms/wely-local/protocol/openid-connect/certs"
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://local-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-chat
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-events
    spec:
      template:
        spec:
          containers:
          - name: events-api
            env:
            - name: MEDIA_API_URL
              value: "http://local-wely-media-service:8085"
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  key: mongo-root-username
                  name: dev-wely-secrets-dev
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: mongo-root-password
                  name: dev-wely-secrets-dev
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@local-wely-mongodb-service:27017/events_db?authSource=admin"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/wely-local"
            # Empty on purpose: the export still carries the old audience mapper, so a local token
            # has no aud to check. Fixing the export is what will also prove it can build a working
            # realm from nothing.
            - name: JWT_AUDIENCES
              value: ""
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://local-wely-auth-service:8080/realms/wely-local/protocol/openid-connect/certs"
            # namePrefix renames the Service, not a value that spells its name.
            - name: SOCIAL_API_URL
              value: "http://local-wely-social-service:8083"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "local-wely-kafka-service:9092"
            - name: TOPIC_PREFIX
              value: "local."
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://local-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-events
- patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cloudflared-connector
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-auth
    spec:
      template:
        spec:
          containers:
          - name: keycloak
            # Local is the only environment that imports the realm, from keycloak/wely-realm.json,
            # which is now the only export of wely-realm there is: wely-identity used to carry a
            # second one, baked into the Keycloak image and hidden by the mount below, that nothing
            # applied and that had already drifted (it alone held wely-mcp-client).
            # It replaces a 357 KB dump of a Keycloak database that used to seed Postgres here —
            # four RSA private keys and a CREDENTIAL table, in a public repository. Keycloak skips
            # a realm that already exists, so the flag would be harmless in dev and prod; it stays
            # out of them because their realm holds state nothing should overwrite on a restart.
            args: ["start", "--import-realm"]
            # Mounted over the whole directory, so the export baked into the image is hidden.
            volumeMounts:
            - name: import-vol
              mountPath: /opt/keycloak/data/import
              readOnly: true
            env:
            - name: KC_HOSTNAME
              value: "localhost"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_DB_URL
              value: "jdbc:postgresql://local-wely-postgres-auth-service:5432/keycloak"
            - name: USERS_API_URL
              value: "http://local-wely-users-service:8082"
            # Resolved into the realm at import time: the export carries
            # "secret": "${KC_CLIENT_SECRET}" rather than a value. Same key wely-users
            # reads, so the two halves of the client credentials cannot drift apart.
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: kc-client-secret
          volumes:
          - name: import-vol
            configMap:
              name: keycloak-realm
              items:
              - key: wely-realm.json
                # Keycloak only imports a file named <realm>-realm.json.
                path: wely-realm-realm.json
  target:
    kind: Deployment
    name: wely-auth
- patch: |-
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: wely-kafka
    spec:
      template:
        spec:
          containers:
          - name: kafka
            env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://local-wely-kafka-service:9092"
  target:
    kind: StatefulSet
    name: wely-kafka
- patch: |-
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: wely-kafka-topics
    spec:
      template:
        spec:
          containers:
          - name: topics
            env:
            # namePrefix renames the Service, not a value that spells its name.
            - name: KAFKA_BOOTSTRAP
              value: "local-wely-kafka-service:9092"
            # NAME:policy, as in the base; the chat's topics are live fan-out, read from latest.
            - name: KAFKA_TOPICS
              value: "USER_CREATED:personal USER_DELETED:erasure USER_MODIFIED:personal EVENT_GROUP_CHANGED EVENT_DATE_FIXED FRIENDSHIP_CHANGED:personal USER_BIRTHDAY:personal BIRTHDAY_NOTICES:personal FRIENDSHIP_NOTICES:personal FRIENDSHIP_STATE:state CALL_EVENTS:live MESSAGE_BROADCAST:live"
  target:
    kind: Job
    name: wely-kafka-topics
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-kafka-ui
    spec:
      template:
        spec:
          containers:
          - name: kafka-ui
            env:
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "local-wely-kafka-service:9092"
  target:
    kind: Deployment
    name: wely-kafka-ui
- patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        kubernetes.io/hostname: docker-desktop
  target:
    kind: Deployment
- patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        kubernetes.io/hostname: docker-desktop
  target:
    kind: StatefulSet
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-media
    spec:
      template:
        spec:
          containers:
          - name: media
            env:
            - name: MEDIA_INTERNAL_ENDPOINT
              value: "http://local-wely-garage-service:3900"
            # The public host the signed URLs name: the signature covers it.
            - name: MEDIA_PUBLIC_ENDPOINT
              value: "http://localhost:3900"
  target:
    kind: Deployment
    name: wely-media

- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-notifications
    spec:
      template:
        spec:
          containers:
          - name: notifications-api
            env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  key: mongo-root-username
                  name: dev-wely-secrets-dev
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: mongo-root-password
                  name: dev-wely-secrets-dev
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@local-wely-mongodb-service:27017/notifications_db?authSource=admin"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/wely-local"
            # Empty on purpose: the export still carries the old audience mapper, so a local token
            # has no aud to check. Fixing the export is what will also prove it can build a working
            # realm from nothing.
            - name: JWT_AUDIENCES
              value: ""
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://local-wely-auth-service:8080/realms/wely-local/protocol/openid-connect/certs"
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "local-wely-kafka-service:9092"
            - name: TOPIC_PREFIX
              value: "local."
            # The deleted-users list; namePrefix renames the Service, not a value that spells its name.
            - name: USERS_API_URL
              value: "http://local-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-notifications
# The shared base creates dev.* and prod.*; a throwaway cluster only ever needs its own. Keyed by
# variable name, not by index: the Job's env list grows and an index says nothing about what it means.
- patch: |-
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: wely-kafka-topics
    spec:
      template:
        spec:
          containers:
          - name: topics
            env:
            - name: KAFKA_ENVS
              value: "local"
  target:
    kind: Job
    name: wely-kafka-topics

# wely-mcp is not otherwise patched here, and would inherit the production audience from base.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-mcp
    spec:
      template:
        spec:
          containers:
          - name: mcp
            env:
            - name: JWT_AUDIENCES
              value: ""
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/wely-local"
  target:
    kind: Deployment
    name: wely-mcp
patchesJson6902:
- target:
    group: ""
    version: v1
    kind: Service
    name: local-wely-users-service-alias
  patch: |-
    - op: replace
      path: /metadata/name
      value: wely-users-service

