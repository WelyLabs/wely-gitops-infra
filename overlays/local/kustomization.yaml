    name: wely-postgres-users
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: "http://local-wely-gateway-service.wely-local.svc.cluster.local:8081"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: KEYCLOAK_URL
        value: "http://localhost:8080"
  target:
    kind: Deployment
    name: wely-web
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
  target:
    kind: Service
    name: wely-web-service
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
  target:
    kind: Service
    name: wely-gateway-service
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
  target:
    kind: Service
    name: wely-auth-service
# Keyed by environment-variable name rather than by index, like the wely-chat patch below
# and unlike the rest of this file. The gateway's env list grew when Redis was added, and an
# index patch says nothing about which variable it means — it silently rewrites whatever
# happens to sit at that position.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-gateway
    spec:
      template:
        spec:
          containers:
          - name: gateway
            env:
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/calendar-app"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://local-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
            - name: USERS_API_URL
              value: "http://local-wely-users-service:8082"
            - name: SOCIAL_API_URL
              value: "http://local-wely-social-service:8083"
            - name: CHAT_API_URL
              value: "http://local-wely-chat-service:8084"
            - name: CHAT_RSOCKET_URL
              value: "ws://local-wely-chat-service:8084"
            - name: EVENTS_API_URL
              value: "http://local-wely-events-service:8086"
            - name: CORS_ALLOWED_ORIGIN
              value: "http://localhost,http://localhost:80,http://localhost:4200"
            # namePrefix renames the Service but not a value that merely spells its name, so
            # the prefix has to be written out here or the gateway looks up a host that does
            # not exist.
            - name: REDIS_HOST
              value: "local-wely-redis-service"
  target:
    kind: Deployment
    name: wely-gateway
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "r2dbc:postgresql://local-wely-postgres-users-service:5432/users"
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "http://localhost:8080/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "http://local-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "http://local-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/token"
    - op: replace
      path: /spec/template/spec/containers/0/env/6/value
      value: "http://local-wely-auth-service:8080"
    - op: replace
      path: /spec/template/spec/containers/0/env/9/value
      value: "local-wely-kafka-service:9092"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
        value: "PLAINTEXT"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_CLOUD_STREAM_KAFKA_BINDER_CONFIGURATION_SECURITY_PROTOCOL
        value: "PLAINTEXT"
  target:
    kind: Deployment
    name: wely-users
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "neo4j://local-wely-neo4j-service:7687"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "local-wely-kafka-service:9092"
    - op: replace
      path: /spec/template/spec/containers/0/env/7/value
      value: "http://localhost:8080/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/8/value
      value: "http://local-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
        value: "PLAINTEXT"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SPRING_CLOUD_STREAM_KAFKA_BINDER_CONFIGURATION_SECURITY_PROTOCOL
        value: "PLAINTEXT"
  target:
    kind: Deployment
    name: wely-social
# Keyed by environment-variable name rather than by index, unlike the patches above.
# The base gained CHAT_BROADCAST_MODE and its Kafka settings, which shifted every index
# after MONGODB_URI: /env/4 stopped being the Keycloak issuer and this overlay silently
# rewrote the wrong variable. A merge patch has no positions to get out of date.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wely-chat
    spec:
      # One replica here, which is the only configuration in which in-process delivery is
      # correct. The alternative would be broadcast mode kafka against the local broker,
      # and that needs MESSAGE_BROADCAST created by hand because the binder is not allowed
      # to create topics.
      replicas: 1
      template:
        spec:
          containers:
          - name: chat
            env:
            - name: CHAT_BROADCAST_MODE
              value: "local"
            # Unused at mode local, since no binder is created. Overridden anyway so that
            # nothing in the local overlay points at cloud infrastructure.
            - name: KAFKA_BOOTSTRAP_SERVER
              value: "local-wely-kafka-service:9092"
            # MONGO_USERNAME and MONGO_PASSWORD are repeated here, unchanged from the base,
            # only to pin their position. Kubernetes expands $(VAR) from variables declared
            # *earlier* in the list and leaves a forward reference as literal text, and a merge
            # patch puts the entries it names first — so without these two, MONGODB_URI would
            # be patched to the front and the pod would try to log in as "$(MONGO_USERNAME)".
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-wely-secrets-dev
                  key: mongo-root-password
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@local-wely-mongodb-service:27017/chat_db?authSource=admin"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:8080/realms/calendar-app"
            - name: KEYCLOAK_INTERNAL_JWK_SET_URI
              value: "http://local-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
  target:
    kind: Deployment
    name: wely-chat
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@local-wely-mongodb-service:27017/events_db?authSource=admin"
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "http://localhost:8080/realms/calendar-app"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "http://local-wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
  target:
    kind: Deployment
    name: wely-events
- patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cloudflared-connector
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "localhost"
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "false"
    - op: replace
      path: /spec/template/spec/containers/0/env/7/value
      value: "jdbc:postgresql://local-wely-postgres-auth-service:5432/keycloak"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: USERS_API_URL
        value: "http://local-wely-users-service:8082"
  target:
    kind: Deployment
    name: wely-auth
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "PLAINTEXT://local-wely-kafka-service:9092"
  target:
    kind: Deployment
    name: wely-kafka
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: "local-wely-kafka-service:9092"
  target:
    kind: Deployment
    name: wely-kafka-ui
- patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        kubernetes.io/hostname: docker-desktop
  target:
    kind: Deployment
- patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        kubernetes.io/hostname: docker-desktop
  target:
    kind: StatefulSet
patchesJson6902:
- target:
    group: ""
    version: v1
    kind: Service
    name: local-wely-users-service-alias
  patch: |-
    - op: replace
      path: /metadata/name
      value: wely-users-service

