    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: keycloak-init-volume
        mountPath: /docker-entrypoint-initdb.d
  target:
    kind: StatefulSet
    name: wely-postgres-auth
- patch: |-
