apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wely-mongodb
  labels:
    app: wely
    component: mongodb
spec:
  serviceName: "wely-mongodb-service"
  replicas: 1
  selector:
    matchLabels:
      app: wely-mongodb
  template:
    metadata:
      labels:
        app: wely-mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: wely-secrets-dev
              key: mongo-root-username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wely-secrets-dev
              key: mongo-root-password
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wely-mongodb-service
spec:
  selector:
    app: wely-mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
