apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        # Pinned: `latest` changed version on any restart, unseen. Bump by hand from the cloudflared releases.
        image: cloudflare/cloudflared:2026.10.1
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 128Mi
        # HTTP/2 over TCP 443 rather than QUIC over UDP 7844: mini-pc-2's network drops outbound UDP, and
        # cloudflared kept retrying QUIC there without ever registering a connection (530 on every hostname).
        args: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-secret
              key: tunnel-token
