apiVersion: apps/v1
kind: Deployment
metadata:
  name: wely-kafka-ui
  labels:
    app: wely
    component: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wely-kafka-ui
  template:
    metadata:
      labels:
        app: wely-kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: provectuslabs/kafka-ui:latest
        ports:
        - containerPort: 8085
        env:
        - name: SERVER_PORT
          value: "8085"
        - name: KAFKA_CLUSTERS_0_NAME
          value: "wely-cluster"
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: "wely-kafka-service:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: wely-kafka-ui-service
spec:
  type: LoadBalancer
  selector:
    app: wely-kafka-ui
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085


