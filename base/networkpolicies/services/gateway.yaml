# gateway: single API entry point. web's nginx proxies /api + /rsocket here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway
spec:
  podSelector:
    matchLabels:
      app: wely-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: wely-web } }          # nginx proxies /api + /rsocket here
        - podSelector: { matchLabels: { app: cloudflared } }       # belt-and-suspenders on the critical path
        - podSelector: { matchLabels: { app: wely-mcp } }          # MCP tools call the API as any client would
      ports:
        - { protocol: TCP, port: 8081 }
    # Management port (actuator): Prometheus only. Neither web nor cloudflared reaches it.
    - from:
        # Prometheus moved to wely-observability; the entry below is kept so a scraper running
        # beside the service still works, and this one admits the shared instance. Inside one
        # `from` element the two selectors are ANDed: this namespace, that pod, nothing else.
        - namespaceSelector: { matchLabels: { wely.dev/role: observability } }
          podSelector: { matchLabels: { app: wely-prometheus } }
        - podSelector: { matchLabels: { app: wely-prometheus } }   # metrics scrape (/actuator/prometheus)
      ports:
        - { protocol: TCP, port: 9081 }
