# web (nginx reverse proxy): public app hostname, entered via cloudflared.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web
spec:
  podSelector:
    matchLabels:
      app: wely-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: cloudflared } }       # public app hostname
      ports:
        - { protocol: TCP, port: 80 }
