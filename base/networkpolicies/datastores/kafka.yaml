# Kafka: the USER_* topics and the event topics. Producers, consumers, topic job, UI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka
spec:
  podSelector:
    matchLabels:
      app: wely-kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: wely-users } }        # produces USER_*
        - podSelector: { matchLabels: { app: wely-social } }       # consumes USER_*, produces FRIENDSHIP_CHANGED
        - podSelector: { matchLabels: { app: wely-chat } }         # message and call fan-out, USER_DELETED
        - podSelector: { matchLabels: { app: wely-events } }       # event topics, USER_DELETED
        - podSelector: { matchLabels: { app: wely-notifications } } # every notifying topic, USER_DELETED
        - podSelector: { matchLabels: { app: wely-kafka-topics } } # one-shot topic creation
        - podSelector: { matchLabels: { app: wely-kafka-ui } }     # monitoring UI
      ports:
        - { protocol: TCP, port: 9092 }
