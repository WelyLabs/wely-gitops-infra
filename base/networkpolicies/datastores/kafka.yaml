# Kafka: USER_CREATED and the event topics. Producers, consumers, topic job, UI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka
spec:
  podSelector:
    matchLabels:
      app: wely-kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: wely-users } }        # produces USER_CREATED
        - podSelector: { matchLabels: { app: wely-social } }       # consumes USER_CREATED
        - podSelector: { matchLabels: { app: wely-chat } }         # message broadcast
        - podSelector: { matchLabels: { app: wely-events } }       # event topics
        - podSelector: { matchLabels: { app: wely-notifications } } # reads every notifying topic
        - podSelector: { matchLabels: { app: wely-kafka-topics } } # one-shot topic creation
        - podSelector: { matchLabels: { app: wely-kafka-ui } }     # monitoring UI
      ports:
        - { protocol: TCP, port: 9092 }
