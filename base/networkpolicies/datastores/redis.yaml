# Redis: per-caller quota / circuit breaker state. Only the gateway uses it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
spec:
  podSelector:
    matchLabels:
      app: wely-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: wely-gateway } }      # per-caller quota / circuit breaker
      ports:
        - { protocol: TCP, port: 6379 }
