# Garage (S3): picture bytes. Clients: media + the services that store media,
# plus the reset, the bucket/key bootstrap and the backup job.
#
# Public image reads go to Garage DIRECTLY, not through the media service: media
# only signs the S3 URLs (dev-media.welylabs.app/...), and the browser then
# fetches the bytes from Garage via cloudflared. So cloudflared needs the S3
# port (3900) — but never the admin port (3903), which stays internal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-garage
spec:
  podSelector:
    matchLabels:
      app: wely-garage
  policyTypes: [Ingress]
  ingress:
    # In-cluster clients: S3 (3900) and, for the bootstrap/backup jobs, admin (3903).
    - from:
        - podSelector: { matchLabels: { app: wely-media } }        # owns picture bytes
        - podSelector: { matchLabels: { app: wely-users } }        # avatars
        - podSelector: { matchLabels: { app: wely-chat } }         # chat media
        - podSelector: { matchLabels: { app: wely-events } }       # event media
        - podSelector: { matchLabels: { app: wely-demo-reset } }   # nightly reset of demo media
        - podSelector: { matchLabels: { app: wely-garage-setup } } # buckets + keys bootstrap
        - podSelector: { matchLabels: { app: wely-garage-backup } }# backup / restore
      ports:
        - { protocol: TCP, port: 3900 }                            # S3 API
        - { protocol: TCP, port: 3903 }                            # admin API (setup)
    # Public signed-URL reads from the browser, via cloudflared: S3 only.
    - from:
        - podSelector: { matchLabels: { app: cloudflared } }       # dev-media.welylabs.app -> garage S3
      ports:
        - { protocol: TCP, port: 3900 }                            # S3 API
