apiVersion: apps/v1
kind: Deployment
metadata:
  name: wely-gateway
  labels:
    app: wely
    component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wely-gateway
  template:
    metadata:
      labels:
        app: wely-gateway
    spec:
      # Non-root, matching the uid baked into the images. A pod that does not need
      # root should not run as it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: wely-registry
      containers:
      - name: gateway
        image: ghcr.io/welylabs/wely-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: KEYCLOAK_ISSUER_URI
          value: "https://auth.welylabs.app/realms/calendar-app"
        - name: KEYCLOAK_INTERNAL_JWK_SET_URI
          value: "http://wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
        - name: USERS_API_URL
          value: "http://wely-users-service:8082"
        - name: SOCIAL_API_URL
          value: "http://wely-social-service:8083"
        - name: CHAT_API_URL
          value: "http://wely-chat-service:8084"
        - name: CHAT_RSOCKET_URL
          value: "ws://wely-chat-service:8084"
        - name: EVENTS_API_URL
          value: "http://wely-events-service:8086"
        - name: MEDIA_API_URL
          value: "http://localhost:8085"
        - name: CORS_ALLOWED_ORIGIN
          value: "https://web.welylabs.app"
        # Holds the rate-limit counters. Not a hard dependency: RedisRateLimiter catches a
        # Redis failure and lets the request through rather than rejecting it, so an outage
        # here means unmetered traffic for its duration, not an unreachable platform.
        - name: REDIS_HOST
          value: "wely-redis-service"
        - name: REDIS_PORT
          value: "6379"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # startupProbe carries the slow first boot on this cluster — Raspberry Pi
        # nodes need well over the 30s a bare initialDelaySeconds would allow. While
        # it runs, liveness is suspended, so a slow start is not mistaken for a hang.
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          periodSeconds: 5
          failureThreshold: 3
        # Requests sized for a Raspberry Pi node. Without them every pod lands in
        # BestEffort, which is the first thing evicted under memory pressure.
        resources:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            cpu: "1"
            memory: 512Mi
        # readOnlyRootFilesystem needs a writable /tmp: the JVM puts its perf data
        # and any temporary file there.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wely-gateway-service
spec:
  selector:
    app: wely-gateway
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
