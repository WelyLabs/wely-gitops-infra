apiVersion: apps/v1
kind: Deployment
metadata:
  name: wely-users
  labels:
    app: wely
    component: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wely-users
  template:
    metadata:
      labels:
        app: wely-users
    spec:
      # Non-root, matching the uid baked into the images. A pod that does not need
      # root should not run as it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: wely-registry
      containers:
      - name: users-api
        image: ghcr.io/welylabs/wely-users:sha-7100366e595e860206f9e1f113e76a29aef8d429
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DB_URL
          value: "r2dbc:postgresql://wely-postgres-users-service:5432/users"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: users-db-username
        - name: KEYCLOAK_ISSUER_URI
          value: "https://auth.welylabs.app/realms/wely-realm"
        - name: KEYCLOAK_INTERNAL_JWK_SET_URI
          value: "http://wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/certs"
        - name: KEYCLOAK_INTERNAL_TOKEN_URI
          value: "http://wely-auth-service:8080/realms/wely-realm/protocol/openid-connect/token"
        - name: KEYCLOAK_BASE_URL
          value: "http://wely-auth-service:8080"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: users-db-password
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: kc-client-secret
        - name: KAFKA_BOOTSTRAP_SERVER
          value: "pkc-e0zxq.eu-west-3.aws.confluent.cloud:9092"
        - name: KAFKA_KEY
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: kafka-key
        - name: KAFKA_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: kafka-secret
        - name: SPRING_R2DBC_PROPERTIES_SSLMODE
          value: "disable"
        - name: INTERNAL_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: internal-secret
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # startupProbe carries the slow first boot on this cluster — Raspberry Pi
        # nodes need well over the 30s a bare initialDelaySeconds would allow. While
        # it runs, liveness is suspended, so a slow start is not mistaken for a hang.
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          periodSeconds: 5
          failureThreshold: 3
        # Requests sized for a Raspberry Pi node. Without them every pod lands in
        # BestEffort, which is the first thing evicted under memory pressure.
        resources:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            cpu: "1"
            memory: 512Mi
        # readOnlyRootFilesystem needs a writable /tmp: the JVM puts its perf data
        # and any temporary file there.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wely-users-service
spec:
  selector:
    app: wely-users
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP
