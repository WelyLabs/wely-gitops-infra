apiVersion: apps/v1
kind: Deployment
metadata:
  name: wely-users
  labels:
    app: wely
    component: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wely-users
  template:
    metadata:
      labels:
        app: wely-users
      # Scraped by observability/prometheus where an overlay deploys it (no token on this path).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /actuator/prometheus
    spec:
      # Non-root, matching the uid baked into the images. A pod that does not need
      # root should not run as it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: wely-registry
      containers:
      - name: users-api
        image: ghcr.io/welylabs/wely-users:sha-7100366e595e860206f9e1f113e76a29aef8d429
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        # Asked whether two users are friends before one sees the other's profile.
        - name: SOCIAL_API_URL
          value: "http://wely-social-service:8083"
        # Pictures go through wely-media, which knows this service by its secret.
        - name: MEDIA_API_URL
          value: "http://wely-media-service:8085"
        - name: MEDIA_API_SECRET
          valueFrom:
            secretKeyRef: { name: dev-wely-garage, key: media-secret-users, optional: true }
        - name: DB_URL
          value: "r2dbc:postgresql://wely-postgres-users-service:5432/users"
        # Same database over JDBC, for the Flyway migrations run at startup.
        - name: DB_JDBC_URL
          value: "jdbc:postgresql://wely-postgres-users-service:5432/users?sslmode=disable"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: users-db-username
        - name: KEYCLOAK_ISSUER_URI
          value: "https://auth.welylabs.app/"
        # The audience this API accepts: the Auth0 API identifier. Empty would accept any authentic
        # token of the tenant, whoever asked for it.
        - name: JWT_AUDIENCES
          value: "wely-api-prod"
        # The Auth0 tenant, and the M2M client wely-users reads, updates and deletes identities with
        # through the Management API (read/update/delete:users, delete:sessions).
        #
        # THE CANONICAL TENANT, NOT auth.welylabs.app. The custom domain serves the login, but the
        # Management API's audience stays https://<tenant>/api/v2/: pointed at the custom domain the
        # token is issued for an audience nothing recognises, and the first account creation after
        # the deploy fails with 401 — the only place it shows.
        - name: AUTH0_DOMAIN
          value: "dev-8k6vch1dvh1qxrdz.eu.auth0.com"
        - name: AUTH0_MGMT_CLIENT_ID
          value: "Xu7NQtbhVT9Ve6HxuuxwM0dhLtCD6J7N"
        - name: AUTH0_MGMT_CLIENT_SECRET
          valueFrom:
            secretKeyRef: { name: dev-wely-cloud, key: auth0-mgmt-client-secret }
        - name: KEYCLOAK_INTERNAL_JWK_SET_URI
          value: "https://auth.welylabs.app/.well-known/jwks.json"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: users-db-password
        - name: KAFKA_BOOTSTRAP_SERVER
          value: "wely-kafka-service.wely-platform.svc.cluster.local:9092"
        # One broker for every environment; this prefix is what separates them. It must match the
        # topics created in the Confluent Cloud console (see the README).
        - name: TOPIC_PREFIX
          value: "prod."
        - name: SPRING_R2DBC_PROPERTIES_SSLMODE
          value: "disable"
        # Checked on POST /profile/provision, called by the Auth0 Action: the same value is its
        # INTERNAL_SECRET_<ENV> secret.
        - name: INTERNAL_SECRET
          valueFrom:
            secretKeyRef: { name: dev-wely-cloud, key: users-internal-secret }
        # Guards GET /user-service/internal/deleted-users; distinct from INTERNAL_SECRET. Unset, the endpoint refuses.
        - name: DELETED_USERS_READER_SECRET
          valueFrom:
            secretKeyRef: { name: dev-wely-deleted-users, key: deleted-users-reader-secret, optional: true }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # startupProbe carries the slow first boot on this cluster — Raspberry Pi
        # nodes need well over the 30s a bare initialDelaySeconds would allow. While
        # it runs, liveness is suspended, so a slow start is not mistaken for a hang.
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          periodSeconds: 5
          failureThreshold: 3
        # Requests sized for a Raspberry Pi node. Without them every pod lands in
        # BestEffort, which is the first thing evicted under memory pressure.
        resources:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            cpu: "1"
            memory: 512Mi
        # readOnlyRootFilesystem needs a writable /tmp: the JVM puts its perf data
        # and any temporary file there.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wely-users-service
spec:
  selector:
    app: wely-users
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP
