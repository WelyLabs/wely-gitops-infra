apiVersion: apps/v1
kind: Deployment
metadata:
  name: wely-chat
  labels:
    app: wely
    component: chat
spec:
  # Two replicas, which is the point of the whole broadcast change: message delivery used
  # to go through an in-process sink, so a second pod would have silently dropped every
  # message whose recipient was connected to the other one. See KafkaMessageBroadcaster.
  replicas: 2
  selector:
    matchLabels:
      app: wely-chat
  template:
    metadata:
      labels:
        app: wely-chat
    spec:
      # Non-root, matching the uid baked into the images. A pod that does not need
      # root should not run as it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: wely-registry
      containers:
      - name: chat
        image: ghcr.io/welylabs/wely-chat:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8084
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: mongo-root-username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: mongo-root-password
        - name: MONGODB_URI
          value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@wely-mongodb-service:27017/chat_db?authSource=admin"
        # kafka: fan out through the broker, so a message reaches the recipient whichever
        # pod holds their stream. local reverts to in-process delivery and is only correct
        # at replicas: 1.
        - name: CHAT_BROADCAST_MODE
          value: "kafka"
        # The consumer group name is derived from this, and a group per pod is what makes
        # every pod receive every record. HOSTNAME is the pod name, so a restarted pod gets
        # a new group and starts from the topic's latest offset — correct here, because a
        # live-update channel has no interest in a backlog.
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KAFKA_BOOTSTRAP_SERVER
          value: "pkc-e0zxq.eu-west-3.aws.confluent.cloud:9092"
        - name: KAFKA_KEY
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: kafka-key
        - name: KAFKA_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: kafka-secret
        - name: KEYCLOAK_ISSUER_URI
          value: "https://auth.welylabs.app/realms/calendar-app"
        - name: KEYCLOAK_INTERNAL_JWK_SET_URI
          value: "http://wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # startupProbe carries the slow first boot on this cluster — Raspberry Pi
        # nodes need well over the 30s a bare initialDelaySeconds would allow. While
        # it runs, liveness is suspended, so a slow start is not mistaken for a hang.
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8084
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8084
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8084
          periodSeconds: 5
          failureThreshold: 3
        # Requests sized for a Raspberry Pi node. Without them every pod lands in
        # BestEffort, which is the first thing evicted under memory pressure.
        resources:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            cpu: "1"
            memory: 512Mi
        # readOnlyRootFilesystem needs a writable /tmp: the JVM puts its perf data
        # and any temporary file there.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wely-chat-service
spec:
  selector:
    app: wely-chat
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
  type: ClusterIP
