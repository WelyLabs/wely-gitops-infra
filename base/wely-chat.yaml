apiVersion: apps/v1
kind: Deployment
metadata:
  name: wely-chat
  labels:
    app: wely
    component: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wely-chat
  template:
    metadata:
      labels:
        app: wely-chat
    spec:
      # Non-root, matching the uid baked into the images. A pod that does not need
      # root should not run as it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: wely-registry
      containers:
      - name: chat
        image: ghcr.io/welylabs/wely-chat:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8084
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: mongo-root-username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: mongo-root-password
        - name: MONGODB_URI
          value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@wely-mongodb-service:27017/chat_db?authSource=admin"
        - name: KEYCLOAK_ISSUER_URI
          value: "https://auth.welylabs.app/realms/calendar-app"
        - name: KEYCLOAK_INTERNAL_JWK_SET_URI
          value: "http://wely-auth-service:8080/realms/calendar-app/protocol/openid-connect/certs"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # startupProbe carries the slow first boot on this cluster — Raspberry Pi
        # nodes need well over the 30s a bare initialDelaySeconds would allow. While
        # it runs, liveness is suspended, so a slow start is not mistaken for a hang.
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8084
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8084
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8084
          periodSeconds: 5
          failureThreshold: 3
        # Requests sized for a Raspberry Pi node. Without them every pod lands in
        # BestEffort, which is the first thing evicted under memory pressure.
        resources:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            cpu: "1"
            memory: 512Mi
        # readOnlyRootFilesystem needs a writable /tmp: the JVM puts its perf data
        # and any temporary file there.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wely-chat-service
spec:
  selector:
    app: wely-chat
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
  type: ClusterIP
