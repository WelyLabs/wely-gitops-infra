# Sets Garage up, idempotently, after every sync: the single node's layout, the buckets, and the
# keys that may use them, imported from the Secret so the services and this Job agree on them.
#
# Garage grants access per bucket, not per path: one bucket per use (avatars, chat photos, event
# covers and receipts). The keys are Garage keys, never AWS ones, and never leave the
# cluster. Rotating one means a new access key id: Garage refuses to re-import a known id.
#
#   wely-media        read + write on all three buckets: stores every picture, signs URLs to read them
#   wely-demo-reset   read + write on all three buckets: the nightly reset removes the demo uploads
#
# 409 from CreateBucket or ImportKey means it already exists: that is the second run.
# wely-users and wely-chat had keys of their own before wely-media; any left are deleted.
apiVersion: batch/v1
kind: Job
metadata:
  name: wely-garage-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      # Numeric: the image names its user (curl_user), which runAsNonRoot cannot verify.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: setup
        image: curlimages/curl:8.22.0
        command:
        - sh
        - -c
        - |
          set -e
          A="http://$GARAGE_ADMIN/v2"
          call() { curl -s -o /tmp/out -w '%{http_code}' -H "Authorization: Bearer $GARAGE_ADMIN_TOKEN" \
                        -H 'Content-Type: application/json' "$A/$1" ${2:+-d "$2"}; }
          ok() { case "$1" in 200|409) ;; *) echo "$2 failed ($1): $(cat /tmp/out)" >&2; exit 1;; esac; }

          for i in $(seq 1 30); do [ "$(call GetClusterStatus)" = 200 ] && break; sleep 10; done
          NODE=$(sed -n 's/.*"id": *"\([0-9a-f]\{64\}\)".*/\1/p' /tmp/out | head -1)
          [ -n "$NODE" ] || { echo "no Garage node found"; exit 1; }

          ok "$(call GetClusterLayout)" GetClusterLayout
          if tr -d ' \n' < /tmp/out | grep -q '"roles":\[\]'; then
            ok "$(call UpdateClusterLayout "{\"roles\":[{\"id\":\"$NODE\",\"zone\":\"pi\",\"capacity\":$CAPACITY_BYTES,\"tags\":[]}]}")" UpdateClusterLayout
            ok "$(call ApplyClusterLayout '{"version":1}')" ApplyClusterLayout
          fi

          bucket() {
            ok "$(call CreateBucket "{\"globalAlias\":\"$1\"}")" "CreateBucket $1"
            ok "$(call "GetBucketInfo?globalAlias=$1")" "GetBucketInfo $1"
            sed -n 's/^ *"id": *"\([0-9a-f]*\)".*/\1/p' /tmp/out | head -1
          }
          AVATARS=$(bucket wely-avatars)
          CHAT=$(bucket wely-chat-media)
          EVENTS=$(bucket wely-event-media)

          key() {
            ok "$(call ImportKey "{\"accessKeyId\":\"$1\",\"secretAccessKey\":\"$2\",\"name\":\"$3\"}")" "ImportKey $3"
          }
          allow() {
            ok "$(call AllowBucketKey "{\"bucketId\":\"$1\",\"accessKeyId\":\"$2\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":false}}")" "AllowBucketKey $3"
          }
          key "$RESET_ACCESS_KEY" "$RESET_SECRET_KEY" wely-demo-reset
          allow "$AVATARS" "$RESET_ACCESS_KEY" wely-demo-reset
          allow "$CHAT" "$RESET_ACCESS_KEY" wely-demo-reset
          allow "$EVENTS" "$RESET_ACCESS_KEY" wely-demo-reset
          if [ -n "${MEDIA_ACCESS_KEY:-}" ]; then
            key "$MEDIA_ACCESS_KEY" "$MEDIA_SECRET_KEY" wely-media
            for b in "$AVATARS" "$CHAT" "$EVENTS"; do allow "$b" "$MEDIA_ACCESS_KEY" wely-media; done
          else
            echo "no key for wely-media yet: it answers MED-TEC-001"
          fi
          # Best effort: a leftover key is harmless enough not to fail the sync over. The answer is
          # pretty-printed, so it is joined, then split one key per line.
          code=$(call ListKeys) || true
          echo "ListKeys: $code"
          if [ "$code" = 200 ]; then
            for name in wely-users wely-chat; do
              for id in $(tr -d '\n' < /tmp/out | sed 's/}/}\n/g' | grep "\"name\": *\"$name\"" | sed -n 's/.*"id": *"\(GK[0-9a-f]*\)".*/\1/p'); do
                code=$(curl -s -o /tmp/del -w '%{http_code}' -X POST -H "Authorization: Bearer $GARAGE_ADMIN_TOKEN" "$A/DeleteKey?id=$id") || true
                echo "DeleteKey $name: $code"
              done
            done
          fi
          echo "Garage ready: buckets wely-avatars, wely-chat-media and wely-event-media"
        env:
        - name: GARAGE_ADMIN
          value: "wely-garage-0.wely-garage-admin:3903"
        - name: CAPACITY_BYTES
          value: "5000000000"
        - name: GARAGE_ADMIN_TOKEN
          valueFrom:
            secretKeyRef: { name: dev-wely-garage, key: garage-admin-token }
        - name: RESET_ACCESS_KEY
          valueFrom:
            secretKeyRef: { name: dev-wely-garage, key: garage-reset-access-key }
        - name: RESET_SECRET_KEY
          valueFrom:
            secretKeyRef: { name: dev-wely-garage, key: garage-reset-secret-key }
        - name: MEDIA_ACCESS_KEY
          valueFrom:
            secretKeyRef: { name: dev-wely-garage, key: garage-media-access-key, optional: true }
        - name: MEDIA_SECRET_KEY
          valueFrom:
            secretKeyRef: { name: dev-wely-garage, key: garage-media-secret-key, optional: true }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests: { cpu: 20m, memory: 16Mi }
          limits: { memory: 64Mi }
