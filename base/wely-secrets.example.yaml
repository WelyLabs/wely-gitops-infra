# Reference of the secret keys every environment must provide.
#
# NOT applied by any kustomization — it documents the contract between the
# deployments (which reference `<prefix>wely-secrets-dev`) and whatever supplies
# the values:
#   overlays/dev   → wely-sealed-secrets-dev.yaml (SealedSecret)
#
# Never commit real values here. To seal a filled-in copy:
#   kubeseal --format yaml < secret.yaml > overlays/<env>/wely-sealed-secrets-<env>.yaml
apiVersion: v1
kind: Secret
metadata:
  name: wely-secrets-dev
type: Opaque
stringData:
  # Auth database (Keycloak)
  auth-db-username: ""
  auth-db-password: ""

  # Keycloak admin and confidential client
  kc-admin-username: ""
  kc-admin-password: ""
  kc-client-secret: ""

  # Shared secret for the internal /profile/resolve endpoint.
  # Must be identical on users-api (app.internal-secret) and on the
  # BusinessIdMapper plugin (INTERNAL_SECRET).
  internal-secret: ""

  # Users database
  users-db-username: ""
  users-db-password: ""

  # Neo4j
  neo4j-username: ""
  neo4j-password: ""

  # MongoDB
  mongo-root-username: ""
  mongo-root-password: ""

  # Tailscale operator (OAuth)
  tailscale-client-id: ""
  tailscale-client-secret: ""
---
# The X-Internal-Secret of wely-media, one per caller, sealed apart:
# overlays/dev/wely-sealed-garage-dev.yaml. The live Secret is still named after the storage that
# held the pictures until 2026-11-15 (they are on Cloudflare R2 now); a SealedSecret only decrypts
# for its original name, so the rename waits for the next reseal of these four values.
# Generate each one with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: wely-garage
type: Opaque
stringData:
  media-secret-users: ""
  media-secret-chat: ""
  media-secret-events: ""
  media-secret-social: ""
---
# Reader secret of wely-users' deleted-users list (GET /user-service/internal/deleted-users), sealed
# apart: overlays/dev/wely-sealed-deleted-users-dev.yaml, not created yet (README, "Account deletion").
# Read by wely-users (to check) and by wely-social, wely-chat, wely-events and wely-notifications (to
# call). Every reference is optional: while it is missing, wely-users refuses the listing.
#   deleted-users-reader-secret   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: wely-deleted-users
type: Opaque
stringData:
  deleted-users-reader-secret: ""
