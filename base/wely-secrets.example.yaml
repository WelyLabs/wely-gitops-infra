# Reference of the secret keys every environment must provide.
#
# NOT applied by any kustomization — it documents the contract between the
# deployments (which reference `<prefix>wely-secrets-dev`) and whatever supplies
# the values:
#   overlays/local → wely-secrets-local.yaml (plaintext, local cluster only)
#   overlays/dev   → wely-sealed-secrets-dev.yaml (SealedSecret)
#   overlays/prod  → to be created
#
# Never commit real values here. To seal a filled-in copy:
#   kubeseal --format yaml < secret.yaml > overlays/<env>/wely-sealed-secrets-<env>.yaml
apiVersion: v1
kind: Secret
metadata:
  name: wely-secrets-dev
type: Opaque
stringData:
  # Auth database (Keycloak)
  auth-db-username: ""
  auth-db-password: ""

  # Keycloak admin and confidential client
  kc-admin-username: ""
  kc-admin-password: ""
  kc-client-secret: ""

  # Shared secret for the internal /profile/resolve endpoint.
  # Must be identical on users-api (app.internal-secret) and on the
  # BusinessIdMapper plugin (INTERNAL_SECRET).
  internal-secret: ""

  # Users database
  users-db-username: ""
  users-db-password: ""

  # Neo4j
  neo4j-username: ""
  neo4j-password: ""

  # MongoDB
  mongo-root-username: ""
  mongo-root-password: ""

  # Tailscale operator (OAuth)
  tailscale-client-id: ""
  tailscale-client-secret: ""
---
# Garage (pictures), sealed apart: overlays/dev/wely-sealed-garage-dev.yaml.
# Generate the values, then seal (procedure: GARAGE-SECRETS.md at the workspace root):
#   garage-rpc-secret        openssl rand -hex 32
#   garage-admin-token       openssl rand -hex 24
#   garage-*-access-key      GK followed by: openssl rand -hex 12   (Garage's key id format)
#   garage-*-secret-key      openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: wely-garage
type: Opaque
stringData:
  garage-rpc-secret: ""
  garage-admin-token: ""
  # demo reset: removes the demo accounts' uploads every night
  garage-reset-access-key: ""
  garage-reset-secret-key: ""
