apiVersion: apps/v1
kind: Deployment
metadata:
  name: wely-auth
  labels:
    app: wely
    component: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wely-auth
  template:
    metadata:
      labels:
        app: wely-auth
    spec:
      imagePullSecrets:
      - name: wely-registry
      containers:
      - name: keycloak
        image: ghcr.io/welylabs/wely-keycloak:latest
        imagePullPolicy: IfNotPresent
        args: ["start"]
        # No probes here yet, deliberately. Keycloak's health endpoints moved to a
        # separate management port in version 25 (:9000/health/ready) from the main
        # port before it (:8080/health/ready), and this image is built from
        # quay.io/keycloak/keycloak:latest — so which of the two applies is unknown
        # until the tag is pinned. A liveness probe on the wrong port would put the
        # identity provider in CrashLoopBackOff and take the whole platform with it.
        #
        # Prerequisite: pin the base image. Then set KC_HEALTH_ENABLED=true and point
        # the probes at the port that version actually uses.
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: kc-admin-username
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: kc-admin-password
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_PROXY
          value: "edge"
        - name: KC_HOSTNAME
          value: "auth.welylabs.app"
        - name: KC_HOSTNAME_STRICT_HTTPS
          value: "true"
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://wely-postgres-auth-service:5432/keycloak"
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: auth-db-username
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: auth-db-password
        # Read by the BusinessIdMapper plugin when it calls users-api to resolve
        # a businessId. Must match app.internal-secret on the users-api side.
        - name: INTERNAL_SECRET
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: internal-secret
      volumes:
      - name: import-vol
        configMap:
          name: kc-import
---
apiVersion: v1
kind: Service
metadata:
  name: wely-auth-service
spec:
  selector:
    app: wely-auth
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
