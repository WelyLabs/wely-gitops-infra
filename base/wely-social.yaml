apiVersion: apps/v1
kind: Deployment
metadata:
  name: wely-social
  labels:
    app: wely
    component: social
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wely-social
  template:
    metadata:
      labels:
        app: wely-social
      # Scraped by observability/prometheus where an overlay deploys it (no token on this path).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: /actuator/prometheus
    spec:
      # Non-root, matching the uid baked into the images. A pod that does not need
      # root should not run as it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: wely-registry
      containers:
      - name: social
        image: ghcr.io/welylabs/wely-social:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: NEO4J_URI
          value: "neo4j://wely-neo4j-service:7687"
        - name: NEO4J_USERNAME
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: neo4j-username
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-wely-secrets-dev
              key: neo4j-password
        - name: KAFKA_BOOTSTRAP_SERVER
          value: "wely-kafka-service.wely-platform.svc.cluster.local:9092"
        # One broker for every environment; this prefix is what separates them. It must match the
        # environment list of platform/base/wely-kafka-topics.yaml.
        - name: TOPIC_PREFIX
          value: "prod."
        - name: KEYCLOAK_ISSUER_URI
          value: "https://auth.welylabs.app/realms/wely-prod"
        # The audience this API accepts, stamped by business-scope's mapper. Empty would accept any
        # authentic token of the realm, whoever asked for it.
        - name: JWT_AUDIENCES
          value: "wely-api-prod"
        - name: KEYCLOAK_INTERNAL_JWK_SET_URI
          value: "http://wely-auth-service.wely-platform.svc.cluster.local:8080/realms/wely-prod/protocol/openid-connect/certs"
        # Pages through wely-users' deleted-users list for the daily erasure reconciliation.
        - name: USERS_API_URL
          value: "http://wely-users-service:8082"
        - name: DELETED_USERS_READER_SECRET
          valueFrom:
            secretKeyRef: { name: dev-wely-deleted-users, key: deleted-users-reader-secret, optional: true }
        # Community pictures go through wely-media, which knows this service by its secret.
        - name: MEDIA_API_URL
          value: "http://wely-media-service:8085"
        - name: MEDIA_API_SECRET
          valueFrom:
            secretKeyRef: { name: dev-wely-garage, key: media-secret-social, optional: true }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # startupProbe carries the slow first boot on this cluster — Raspberry Pi
        # nodes need well over the 30s a bare initialDelaySeconds would allow. While
        # it runs, liveness is suspended, so a slow start is not mistaken for a hang.
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8083
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          periodSeconds: 5
          failureThreshold: 3
        # Requests sized for a Raspberry Pi node. Without them every pod lands in
        # BestEffort, which is the first thing evicted under memory pressure.
        resources:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            cpu: "1"
            memory: 512Mi
        # readOnlyRootFilesystem needs a writable /tmp: the JVM puts its perf data
        # and any temporary file there.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wely-social-service
spec:
  selector:
    app: wely-social
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
  type: ClusterIP
