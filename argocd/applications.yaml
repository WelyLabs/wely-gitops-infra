apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wely-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WelyLabs/wely-gitops-infra.git
    targetRevision: HEAD
    path: platform/shared
  destination:
    server: https://kubernetes.default.svc
    namespace: wely-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wely-tailscale
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WelyLabs/wely-gitops-infra.git
    targetRevision: HEAD
    path: platform/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are large enough that a client-side apply exceeds the annotation size limit.
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wely-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WelyLabs/wely-gitops-infra.git
    targetRevision: HEAD
    path: observability/shared
  destination:
    server: https://kubernetes.default.svc
    namespace: wely-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wely-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WelyLabs/wely-gitops-infra.git
    targetRevision: HEAD
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: wely-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
# wely-prod is commented out on purpose, not forgotten.
#
# overlays/prod cannot start: its images are tagged latest and it defines no Secret. Applying this
# file used to create the Application anyway, and `prune: true` + `selfHeal: true` then pushed the
# whole of prod onto the single node — pods pulling images, a Redis running, a cloudflared
# connector scheduled, all of it unable to come up. That happened on 2026-10-25, from an apply
# meant only to add wely-tailscale.
#
# Deleting the Application does not undo it: there is no resources-finalizer here, so the
# namespace and its workloads are left orphaned and have to be removed by hand.
#
# Uncomment it when overlays/prod has pinned images and sealed secrets, and when the node has room
# for a second environment — not before.
