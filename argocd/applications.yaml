apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wely-tailscale
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WelyLabs/wely-gitops-infra.git
    targetRevision: HEAD
    path: platform/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are large enough that a client-side apply exceeds the annotation size limit.
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wely-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WelyLabs/wely-gitops-infra.git
    targetRevision: HEAD
    path: observability/shared
  destination:
    server: https://kubernetes.default.svc
    namespace: wely-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wely-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WelyLabs/wely-gitops-infra.git
    targetRevision: HEAD
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: wely-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
# No wely-prod Application here: overlays/prod was removed on 2026-11-15. A production environment
# will be built as a copy of overlays/dev — same images, same managed services, different realm and
# topic prefix — rather than kept as a half-written overlay nothing deploys.
#
# Two lessons from the one that existed, worth keeping when it comes back:
#   - `kubectl apply -f` on this file applies EVERY Application in it. On 2026-10-25 an apply meant
#     only to add wely-tailscale also created wely-prod, and `prune: true` + `selfHeal: true` pushed
#     the whole of prod onto the single node within seconds. Apply a file that holds one Application.
#   - Deleting the Application does not undo it: there is no resources-finalizer here, so the
#     namespace and its workloads are left orphaned and have to be removed by hand.
