# Grafana: dashboards and alerting over observability/prometheus, all provisioned from this
# directory. Nothing is configured by hand: what the UI changes is lost at the next restart
# (grafana.yaml explains why that is acceptable).
#
#   provisioning/datasources.yaml       the Prometheus datasource, uid "prometheus"
#   provisioning/dashboard-provider.yaml loads dashboards/*.json into the folder "Wely"
#   provisioning/alerting/*.yaml        contact point "discord", notification policy, alert rules
#   dashboards/*.json                   the four dashboards, plain Grafana JSON
#
# Not part of base/, like Prometheus: an overlay opts in by listing this directory and pointing
# PROMETHEUS_URL at its own Prometheus Service (overlays/dev does).
#
# Secrets, both optional (seal-grafana-secrets.sh at the workspace root seals them):
#   wely-grafana             admin-user, admin-password
#   wely-grafana-alerting    discord-webhook-url
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - grafana.yaml
  - networkpolicy.yaml
  # Tailnet access over HTTPS; needs the Tailscale operator (platform/tailscale).
  - ingress.yaml

# Generated, so any change renames the ConfigMap and rolls the pod. Grafana reads its
# provisioning at start.
configMapGenerator:
  - name: wely-grafana-datasources
    files:
      - provisioning/datasources.yaml
  - name: wely-grafana-dashboard-provider
    files:
      - provisioning/dashboard-provider.yaml
  - name: wely-grafana-alerting-config
    files:
      - provisioning/alerting/contact-points.yaml
      - provisioning/alerting/notification-policies.yaml
      - provisioning/alerting/rules.yaml
  # One ConfigMap for the four dashboards: about 100KB, far from the 1MiB a ConfigMap may hold.
  - name: wely-grafana-dashboards
    files:
      - dashboards/wely-overview.json
      - dashboards/wely-pi-jvms.json
      - dashboards/wely-data-messaging.json
      - dashboards/wely-product.json
