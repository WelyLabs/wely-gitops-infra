# The whole notification policy tree (provisioning replaces it): everything goes to Discord, one
# message per alert rule and service, repeated every 4 hours while it keeps firing.
apiVersion: 1

policies:
  - orgId: 1
    receiver: discord
    group_by: ["alertname", "app"]
    # Waits 30s before the first message of a group, so alerts firing together arrive together.
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
