# grafana: no ingress at all. It is read with `kubectl port-forward`, which enters the pod's
# network namespace and is not filtered here, like the kubelet probes
# (base/networkpolicies/README.md). Not routed through the tunnel either.
# Outgoing traffic is not filtered in this repository: Grafana reaches Prometheus (admitted by
# observability/prometheus/networkpolicy.yaml) and Discord's webhook API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana
spec:
  podSelector:
    matchLabels:
      app: wely-grafana
  policyTypes: [Ingress]
  ingress:
    # The Tailscale proxies, which the operator runs in the tailscale namespace to put this
    # Service on the tailnet. Selected by namespace rather than by pod label: the operator names
    # those pods after the Service's UID, so there is no stable label to match. The namespace
    # carries no label of its own upstream, hence kubernetes.io/metadata.name, which Kubernetes
    # sets on every namespace.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: tailscale } }
      ports:
        - { protocol: TCP, port: 3000 }

