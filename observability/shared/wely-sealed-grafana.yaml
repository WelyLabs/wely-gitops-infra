---
# Re-declared for wely-observability. The seal is cluster-wide, so the ciphertext is bound
# to neither a name nor a namespace and these are the values already live in wely-dev.
# Rotating one means resealing it in both places until the dev copies are retired.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: wely-grafana
  namespace: wely-observability
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: wely-grafana
      namespace: wely-observability
