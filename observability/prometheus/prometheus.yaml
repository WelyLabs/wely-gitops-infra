# Prometheus: scrapes the opted-in pods of its namespace and the node's kubelet (prometheus.yml),
# keeps 7 days.
#
# Storage: a 2Gi claim on the cluster's default StorageClass (k3s local-path), like every
# datastore in base/, so the history survives a restart. local-path does NOT enforce the claim's
# size: --storage.tsdb.retention.size is the real cap, set below the claim.
#
# Not exposed: a ClusterIP Service, no route in the tunnel, and a NetworkPolicy that admits Grafana
# alone (networkpolicy.yaml). Read it in Grafana (observability/grafana), or directly with
#   kubectl -n <ns> port-forward svc/<prefix>wely-prometheus-service 9090
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wely-prometheus
  labels:
    app: wely
    component: prometheus
spec:
  serviceName: "wely-prometheus-service"
  replicas: 1
  selector:
    matchLabels:
      app: wely-prometheus
  template:
    metadata:
      labels:
        app: wely-prometheus
    spec:
      serviceAccountName: wely-prometheus
      # Non-root: the image's own user (nobody). local-path creates its directories world-writable,
      # as Garage's claim already relies on.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        # Pinned by tag and digest (multi-arch index, arm64 included).
        image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        # Counts the blocks, the WAL and the head chunks; kept under the 2Gi claim.
        - --storage.tsdb.retention.size=1536MB
        - --web.listen-address=:9090
        # Prometheus 3 derives GOMEMLIMIT from the memory limit below (auto-gomemlimit, on by
        # default), so the Go heap is collected before the container is OOM-killed.
        ports:
        - containerPort: 9090
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # A WAL replay after a restart can take a while on a Pi: /-/healthy answers during it,
        # /-/ready only once it is done. startupProbe keeps liveness off until then.
        startupProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 5
          failureThreshold: 60
        # 5s rather than the default 1s: when several JVMs start at once the Pi's four cores sit
        # at 100% and a 1s probe times out (seen on 2026-10-20: three misses in a row restarted
        # a healthy Prometheus in the middle of a rollout).
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Ten targets at 30s: about 10 000 series (9 300 measured before node-exporter and the
        # trimmed cAdvisor job, which add a few hundred), for a working set near 80Mi. The limit
        # leaves room for Grafana's range queries; sized for the Raspberry Pi node.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 384Mi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: prometheus-data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: wely-prometheus-config
  volumeClaimTemplates:
  - metadata:
      name: prometheus-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wely-prometheus-service
  annotations:
    # Put this Service on the tailnet. The Tailscale operator (platform/tailscale) notices the
    # annotation and runs a proxy that joins the tailnet and forwards here, so the UI is reachable
    # from your own devices at the hostname below — and from nowhere else. It replaces a
    # kubectl port-forward; it does not remove any public exposure, because there never was one.
    tailscale.com/expose: "true"
    tailscale.com/hostname: "wely-prometheus"
  labels:
    app: wely
    component: prometheus
spec:
  type: ClusterIP
  selector:
    app: wely-prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
