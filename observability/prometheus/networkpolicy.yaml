# prometheus: Grafana only (observability/grafana), on the API port. Nothing else in the cluster
# needs to call it; read it with `kubectl port-forward`, which enters the pod's network namespace
# and is not filtered here, like the kubelet probes (base/networkpolicies/README.md).
# Without this policy the pod would accept connections from any pod, cloudflared included.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
spec:
  podSelector:
    matchLabels:
      app: wely-prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: wely-grafana } }   # datasource queries (/api/v1/query*)
      ports:
        - { protocol: TCP, port: 9090 }
