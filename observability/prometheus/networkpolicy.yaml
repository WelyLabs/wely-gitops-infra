# prometheus: Grafana only (observability/grafana), on the API port. Nothing else in the cluster
# needs to call it; read it with `kubectl port-forward`, which enters the pod's network namespace
# and is not filtered here, like the kubelet probes (base/networkpolicies/README.md).
# Without this policy the pod would accept connections from any pod, cloudflared included.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
spec:
  podSelector:
    matchLabels:
      app: wely-prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: wely-grafana } }   # datasource queries (/api/v1/query*)
      ports:
        - { protocol: TCP, port: 9090 }
    # The Tailscale proxies, which the operator runs in the tailscale namespace to put this
    # Service on the tailnet. Selected by namespace rather than by pod label: the operator names
    # those pods after the Service's UID, so there is no stable label to match. The namespace
    # carries no label of its own upstream, hence kubernetes.io/metadata.name, which Kubernetes
    # sets on every namespace.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: tailscale } }
      ports:
        - { protocol: TCP, port: 9090 }
