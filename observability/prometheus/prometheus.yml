global:
  # Seven small JVMs on a Raspberry Pi: 30s is plenty for error counters and keeps the TSDB small.
  # Grafana's datasource declares the same 30s (timeInterval), so $__rate_interval is at least 2m.
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  # Prometheus itself (TSDB size, scrape durations), over loopback.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Every pod of this namespace that opts in with the prometheus.io/* annotations.
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        # Only the namespace Prometheus runs in: the Role in rbac.yaml grants nothing else.
        namespaces:
          own_namespace: true
    relabel_configs:
      # Opt-in only.
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # A port must be named: no guessing from the container ports.
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: keep
        regex: "\\d+"
      # Completed or pending pods have nothing to serve.
      - source_labels: [__meta_kubernetes_pod_phase]
        action: keep
        regex: Running
      # The pod discovery yields one target per container port; all of them are rewritten to the
      # same pod IP and annotated port below, and identical targets collapse into one.
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: "(.+);(\\d+)"
        replacement: "$1:$2"
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        regex: "(.+)"
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

  # cAdvisor, as embedded in the kubelet: container memory, CPU and throttling, which the JVMs
  # cannot report about themselves, plus the node's own network interfaces.
  #
  # Straight to the kubelet (https://<node InternalIP>:10250/metrics/cadvisor) rather than through
  # the API server proxy (/api/v1/nodes/<node>/proxy/metrics/cadvisor): the kubelet authorises
  # /metrics/* as the nodes/metrics subresource, while the proxy route needs nodes/proxy, which also
  # opens the kubelet's other endpoints (exec over a WebSocket upgrade included). On k3s the
  # kubelet's serving certificate is signed by the cluster CA mounted in every pod (k3s-server-ca)
  # and carries the node's InternalIP and hostname as SANs, so the TLS check passes unchanged.
  # Read access: the ClusterRole in rbac.yaml.
  - job_name: kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    kubernetes_sd_configs:
      # One target per node, at its first InternalIP and kubelet port (10250).
      - role: node
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    # The kubelet exposes ~6 000 series for every container of the node; the Pi keeps ~100.
    metric_relabel_configs:
      # 1. A handful of metric names.
      - source_labels: [__name__]
        action: keep
        regex: "container_(memory_working_set_bytes|spec_memory_limit_bytes|cpu_usage_seconds_total|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|network_receive_bytes_total|network_transmit_bytes_total)"
      # 2. Then only the series that answer a question, keyed on name;namespace;container;id;interface:
      #    - memory and CPU per container of this environment (container="" is the pod cgroup or
      #      the pause container, dropped);
      #    - CFS throttling per pod: this kubelet reports it on the pod cgroup only (container="");
      #    - network of the node itself (id="/", the root cgroup, which sits in the host network
      #      namespace), on its real interfaces. node-exporter runs in the pod network and cannot
      #      see them (observability/node-exporter).
      #    container_fs_usage_bytes is not kept: with containerd, this kubelet reports it for the
      #    root cgroup only, which node-exporter's filesystem collector already covers.
      #    The namespace is written out: this file is deployed by overlays/dev only.
      - source_labels: [__name__, namespace, container, id, interface]
        action: keep
        regex: "container_(memory_working_set_bytes|spec_memory_limit_bytes|cpu_usage_seconds_total);wely-dev;[^;]+;[^;]*;|container_cpu_cfs_(throttled_periods|periods)_total;wely-dev;;[^;]*;|container_network_(receive|transmit)_bytes_total;;;/;(eth0|wlan0|tailscale0)"
      # 3. The cgroup path, the containerd id and the image digest change on every restart or
      #    deploy and identify nothing namespace/pod/container do not.
      - action: labeldrop
        regex: "id|name|image"
