# node-exporter: the Raspberry Pi itself (CPU, memory, disks, load, temperature), scraped by
# observability/prometheus through the same pod annotations as the services.
#
# Not part of base/, for the same reason as Prometheus: one DaemonSet covers the nodes, whatever
# number of environments render base/. It is listed by observability/shared.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - node-exporter.yaml
  - networkpolicy.yaml
