apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Tailscale operator, which puts chosen Services on the tailnet instead of on the public web.
#
# One per cluster, not one per environment: it watches Services everywhere and creates its proxy
# pods in the tailscale namespace, so a second instance would fight the first. It therefore has an
# ArgoCD Application of its own rather than living in an environment overlay — the hand-written
# version sat in base/, which would have given every environment a copy of it.
#
# No `namespace:` transformer here: the upstream manifest carries its own namespaces, and the
# transformer would move the namespace-scoped Roles out of `tailscale`, where their whole point is
# to confine the operator's access to secrets.
#
# TWO THINGS LIVE IN THE TAILNET POLICY, NOT HERE, and the operator crash-loops without them:
#
#   1. `tag:k8s-operator` must exist in tagOwners, and the OAuth client must be allowed to use it.
#      Otherwise the operator dies at startup with "requested tags [tag:k8s-operator] are invalid
#      or not permitted (400)" — which is what happened on first install, 2026-10-25. The ACL needs
#      at least:
#          "tagOwners": { "tag:k8s-operator": [], "tag:k8s": ["tag:k8s-operator"] }
#      The proxies the operator creates are tagged tag:k8s, so that second entry is not optional.
#   2. HTTPS certificates must be enabled for the tailnet, or a Tailscale Ingress never gets one
#      and stays without an address (observability/grafana/ingress.yaml depends on this).
resources:
- operator.yaml
- wely-sealed-operator-oauth.yaml

# Upstream ships `:stable`, a floating tag on a controller that creates StatefulSets and reads the
# tailnet credentials. Pinned to the release this manifest was vendored from.
images:
- name: tailscale/k8s-operator
  newName: tailscale/k8s-operator
  newTag: v1.104.1
