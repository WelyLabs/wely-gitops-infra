---
# The OAuth client the operator authenticates to the tailnet with.
#
# Upstream names this Secret operator-oauth with keys client_id / client_secret, and the
# Deployment mounts it as files (CLIENT_ID_FILE / CLIENT_SECRET_FILE). The ciphertext below is the
# one already sealed for wely-dev: the seals in this repo are cluster-wide, so it is bound to
# neither a name nor a namespace, and only the key names differ. Rotating the OAuth client means
# resealing in both places until the dev copy is retired with the hand-written manifest.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: operator-oauth
  namespace: tailscale
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
spec:
  encryptedData:
    client_id: 
    client_secret: 
  template:
    metadata:
      name: operator-oauth
      namespace: tailscale
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
    type: Opaque
