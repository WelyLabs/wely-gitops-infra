# A StatefulSet with a volume, like the databases. As a Deployment without one, every restart
# wiped topics, messages and consumer offsets, and the binders may not create topics: wely-social
# could no longer bind and the outbox parked its events. Topics are created by wely-kafka-topics.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wely-kafka
  labels:
    app: wely
    component: kafka
spec:
  serviceName: "wely-kafka-service"
  replicas: 1
  selector:
    matchLabels:
      app: wely-kafka
  template:
    metadata:
      labels:
        app: wely-kafka
    spec:
      # local-path volume: the log segments live on pi5's disk, so the pod belongs there.
      nodeSelector:
        kubernetes.io/hostname: pi5
      containers:
      - name: kafka
        image: apache/kafka:3.8.0
        resources:
          # The broker would otherwise size its heap from the whole Pi (1 GiB by default),
          # and nothing here needs more than a few hundred megabytes of heap.
          requests:
            memory: 512Mi
          limits:
            memory: 768Mi
        ports:
        - containerPort: 9092
        env:
        # A fixed heap: the JVM default ignores the container limit for Kafka's own scripts.
        - name: KAFKA_HEAP_OPTS
          value: "-Xms384m -Xmx384m"
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
        # Clients live in other namespaces (wely-dev, wely-prod), and a broker hands them this
        # address to reconnect to: a bare Service name resolves only inside wely-platform, so the
        # first produce after the metadata round-trip would fail. The local overlay keeps everything
        # in one namespace, where the FQDN still resolves.
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://wely-kafka-service.wely-platform.svc.cluster.local:9092"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@localhost:9093"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        - name: KAFKA_CLUSTER_ID
          value: "MkU3OEVBNTcwNTJENDM2Qk"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data"
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wely-kafka-service
spec:
  selector:
    app: wely-kafka
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092
