apiVersion: apps/v1
kind: Deployment
metadata:
  name: wely-kafka-ui
  labels:
    app: wely
    component: kafka-ui
spec:
  # Off by default: a debugging tool, about 300 MiB of JVM on a Pi with 8 GiB for everything.
  # To use it, set 1 here and let Argo sync (a manual scale would be reverted by selfHeal).
  replicas: 0
  selector:
    matchLabels:
      app: wely-kafka-ui
  template:
    metadata:
      labels:
        app: wely-kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: provectuslabs/kafka-ui:latest
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 512Mi
        ports:
        - containerPort: 8085
        env:
        - name: JAVA_OPTS
          value: "-Xmx256m"
        - name: SERVER_PORT
          value: "8085"
        - name: KAFKA_CLUSTERS_0_NAME
          value: "wely-cluster"
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: "wely-kafka-service:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: wely-kafka-ui-service
spec:
  type: LoadBalancer
  selector:
    app: wely-kafka-ui
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085


