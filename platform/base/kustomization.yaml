apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The shared singleton as a reusable base: one Keycloak.
#
# Keycloak isolates environments by REALM (wely-dev, wely-prod), a real tenancy boundary of the
# product, which is why sharing the runtime is sound — and why observability stayed out:
# Prometheus holds a Role scoped to the namespace it watches, so moving it would mean RBAC in
# every environment for no gain while prod cannot start. Kafka drew the same boundary with a topic
# prefix until 2026-11-15, when it moved to Confluent Cloud and left this layer.
#
# One consumer today, platform/shared/ — the instance on the Pi, in wely-platform, serving wely-dev
# and wely-prod. The split is kept so a second instance costs a directory, not a refactor. Hence no
# namespace and no realm job here: both belong to the consumer.
resources:
- wely-auth.yaml
- wely-postgres-auth.yaml
- networkpolicies
# Lets the shared Prometheus list the pods of this namespace, so it can discover Keycloak.
- prometheus-rbac.yaml
