apiVersion: apps/v1
kind: Deployment
metadata:
  name: wely-auth
  labels:
    app: wely
    component: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wely-auth
  template:
    metadata:
      labels:
        app: wely-auth
    spec:
      imagePullSecrets:
      - name: wely-registry
      containers:
      - name: keycloak
        image: ghcr.io/welylabs/wely-keycloak:latest
        resources:
          # Keycloak sizes its heap from the container limit (MaxRAMPercentage); without a limit it
          # reads the whole node and grows as far as it likes.
          requests:
            memory: 512Mi
          limits:
            memory: 896Mi
        imagePullPolicy: IfNotPresent
        args: ["start"]
        # The prerequisite the previous comment set is met: wely-identity's Dockerfile pins
        # quay.io/keycloak/keycloak:26.8.0, and the running server reports 26.8.0 — so health is
        # on the management port (:9000), the form introduced in 25, not on :8080.
        #
        # Without a readinessProbe Kubernetes marks the container ready the moment it starts, so
        # the Service got an endpoint while Keycloak was still booting — minutes, on this node —
        # and cloudflared answered 502 to every login in the meantime. That is what these probes
        # fix; it is also why readiness is the one that matters here.
        #
        # No livenessProbe on purpose. This is a single replica serving every environment: a
        # liveness check that trips while the server is merely slow under memory pressure would
        # restart the identity provider the whole platform authenticates against, turning a
        # slowdown into an outage. Readiness takes it out of rotation without killing it.
        #
        startupProbe:
          # Generous: a cold start on this node takes minutes, and until this passes the other
          # probes are not run at all, so a slow boot is never mistaken for a failure.
          httpGet: { path: /health/started, port: 9000 }
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          # Deliberately the listening socket, not /health/ready. Measured on this deployment,
          # that endpoint answers "status": "DOWN" — and takes minutes to say it. The failing
          # entry is "Keycloak cluster health check", the Infinispan cache cluster, not the
          # datasource: with one replica and no JGroups discovery configured there is no cluster
          # to be healthy, so readiness on it would never pass and the pod would never join the
          # Service. A first attempt did exactly that, sitting 0/1 for thirty minutes.
          #
          # The socket is the condition that actually caused the 502s: cloudflared could not
          # connect to 8080 while Keycloak was still booting. /health/started above proves the
          # server finished starting, so the pair reads "started, and accepting connections".
          #
          # What this gives up: a Keycloak that later loses its database still reports ready.
          # That matches the Spring services, whose readiness ignores their databases too, and at
          # one replica taking it out of rotation would be indistinguishable from an outage.
          tcpSocket: { port: 8080 }
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        # Heap at most 55% of the limit, leaving room for metaspace and threads under 896Mi.
        - name: JAVA_OPTS_KC_HEAP
          value: "-XX:MaxRAMPercentage=55 -XX:InitialRAMPercentage=30"
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: wely-secrets-platform
              key: kc-admin-username
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wely-secrets-platform
              key: kc-admin-password
        # Serves /health/* on the management port. Off by default, and the probes above are
        # useless without it: port 9000 simply refuses connections.
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_PROXY
          value: "edge"
        # The scheme matters: without it Keycloak advertises http:// in its discovery document and
        # mints tokens with an http:// issuer, which every service rejects — it validates against
        # https://auth.welylabs.app/realms/<realm>. The realm answers 200 either way, so the
        # mismatch only shows up as a failed login.
        - name: KC_HOSTNAME
          value: "https://auth.welylabs.app"
        - name: KC_HOSTNAME_STRICT_HTTPS
          value: "true"
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://wely-postgres-auth-service:5432/keycloak"
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: wely-secrets-platform
              key: auth-db-username
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wely-secrets-platform
              key: auth-db-password
        # Read by the BusinessIdMapper plugin and by BusinessUserRegistration when they call
        # users-api. {env} is substituted with the environment of the realm being authenticated
        # (wely-dev -> dev), because one Keycloak serves several realms and each has its own
        # users-api: a fixed URL would hand every realm the business ids of one environment, with
        # a valid signature and a valid audience to go with them. A realm not named wely-<env> is
        # refused rather than guessed — see UsersServiceClient.baseUrlFor.
        - name: USERS_API_URL
          value: "http://wely-users-service.wely-{env}.svc.cluster.local:8082"
        # Read by the BusinessIdMapper plugin when it calls users-api to resolve
        # a businessId. Must match app.internal-secret on the users-api side.
        - name: INTERNAL_SECRET
          valueFrom:
            secretKeyRef:
              name: wely-secrets-platform
              key: internal-secret
      volumes:
      - name: import-vol
        configMap:
          name: kc-import
---
apiVersion: v1
kind: Service
metadata:
  name: wely-auth-service
spec:
  selector:
    app: wely-auth
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
