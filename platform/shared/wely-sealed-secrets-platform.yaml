---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wely-secrets-platform
  namespace: wely-platform
  annotations:
    # cluster-wide, like every seal in this repo: the ciphertext is bound to neither a name nor a
    # namespace, so these are the values already live in wely-dev, re-declared for the shared
    # Keycloak. internal-secret is the one the BusinessIdMapper sends to users-api; rotating any of
    # them means resealing in both places.
    sealedsecrets.bitnami.com/cluster-wide: "true"
spec:
  encryptedData:
    auth-db-password: 
    auth-db-username: 
    internal-secret: 
    kc-admin-password: 
    kc-admin-username: 
  template:
    metadata:
      name: wely-secrets-platform
      namespace: wely-platform
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
    type: Opaque
