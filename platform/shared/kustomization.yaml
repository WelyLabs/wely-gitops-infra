apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The shared Keycloak and Kafka of the Raspberry Pi, serving wely-dev and wely-prod.
#
# What is shared is also a shared failure domain: upgrading Keycloak signs every environment out
# at once. That is the trade accepted on one Pi, where a single environment already reserves
# ~4.5 Gi.
namespace: wely-platform

resources:
- ../base
- namespace.yaml
- wely-sealed-secrets-platform.yaml
# - realm/realm-settings-job.yaml
#   Taken out of the sync path on 2026-10-24. As a PostSync hook it gates every deployment, and it
#   cannot finish on this node: its script makes ~40 kcadm calls, each of which starts a JVM, and
#   `set -e` aborts the whole run on the first one that times out. It then blocked the sync of
#   everything behind it, including a Keycloak fix. Its work is re-assertion, not setup — the realm
#   already carries those settings — so leaving it out costs nothing today. Re-enable it when the
#   node has headroom, or split it into steps that can fail independently.

# Read by the realm job. mcp-client.json is a template: the job substitutes __MCP_CLIENT__ with
# the realm's client id before creating it.
configMapGenerator:
- files:
  - realm/realm-settings.json
  - realm/master-settings.json
  - realm/mcp-client.json
  name: wely-realm-settings

# Same tag the environments deploy, so kcadm in the realm job matches the running server and the
# Pi already holds the image.
images:
- name: ghcr.io/welylabs/wely-keycloak
  newName: ghcr.io/welylabs/wely-keycloak
  newTag: sha-1f8f82ba402b4b56d904d6dbe02931a25f26e7fb

patches:
# Placement. Keycloak, its PostgreSQL and Kafka run on the workload node with the services that
# query them: serverwely1 has an SSD where the Pi writes to an SD card — the component that dies
# first on these machines, and the one Kafka, Postgres, Mongo and Neo4j write to continuously —
# plus 11.6 Gi allocatable against the Pi's 7.9, which is already at 99% of its memory limits.
# Observability went the other way, onto pi5: a scraper that lives on the node it watches is a
# scraper you lose together with the node. The two roles are one label with two values, so the
# swap is two `kubectl label` calls and no manifest change.
#
# A blanket patch rather than a nodeSelector per file, so a workload added here lands on the
# right node without anyone remembering to write it.
- patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        wely.dev/role: workload
  target:
    kind: Deployment
- patch: |-
    - op: add
      path: /spec/template/spec/nodeSelector
      value:
        wely.dev/role: workload
  target:
    kind: StatefulSet

